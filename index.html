<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WORKLINK SIIT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Plus Jakarta Sans', sans-serif; }
  body { background: #F7F8FB; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #E2E5EC; border-radius: 8px; }
  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
  .pop-in { animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popIn { from { opacity: 0; transform: scale(.85);} to { opacity: 1; transform: scale(1);} }
</style>
</head>
<body class="min-h-screen text-slate-900">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

/* ---------------- Mock Data ---------------- */

const CATEGORIES = ["Coding", "Design", "Writing", "Tutoring", "Photography", "Excel/Data"];

const AVATAR_COLORS = ["bg-blue-100 text-blue-700","bg-violet-100 text-violet-700","bg-emerald-100 text-emerald-700","bg-amber-100 text-amber-700","bg-rose-100 text-rose-700","bg-cyan-100 text-cyan-700"];

function initials(name) {
  return name.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
}

function Avatar({ name, size = "w-10 h-10 text-sm" }) {
  const idx = name.charCodeAt(0) % AVATAR_COLORS.length;
  return (
    <div className={`${size} ${AVATAR_COLORS[idx]} rounded-full flex items-center justify-center font-bold shrink-0`}>
      {initials(name)}
    </div>
  );
}

const CURRENT_USER = {
  name: "You",
  program: "Digital Business, Year 2",
  rating: 4.8,
  reviews: 6,
};

const INITIAL_SERVICES = [
  { id: "s1", type: "service", name: "Ploy Suwannarat", title: "Python Debugging & Homework Help", category: "Coding", description: "I can help you debug Python assignments, fix errors, and explain concepts clearly. 2nd year DSI student.", price: "150 THB/hr", rating: 4.9, reviews: 21, status: "Active" },
  { id: "s2", type: "service", name: "Nut Chaiyaporn", title: "Figma UI/UX Design", category: "Design", description: "Clean, modern Figma designs for posters, apps, and presentations. Fast turnaround, portfolio available.", price: "300 THB/project", rating: 5.0, reviews: 14, status: "Active" },
  { id: "s3", type: "service", name: "Fah Kittipong", title: "English Proofreading & Editing", category: "Writing", description: "Native-level English editing for essays, reports, and presentations. Grammar, tone, and clarity fixes.", price: "80 THB/page", rating: 4.8, reviews: 33, status: "Active" },
  { id: "s4", type: "service", name: "Beam Anurak", title: "Calculus & Linear Algebra Tutoring", category: "Tutoring", description: "1-on-1 tutoring sessions for ICT math courses. I explain step by step until it clicks.", price: "200 THB/hr", rating: 4.9, reviews: 18, status: "Active" },
  { id: "s5", type: "service", name: "Ice Napassorn", title: "Event & Portrait Photography", category: "Photography", description: "I shoot campus events, portraits, and product photos. Includes basic editing and same-week delivery.", price: "500 THB/session", rating: 5.0, reviews: 9, status: "Active" },
  { id: "s6", type: "service", name: "Bank Thanapat", title: "Excel & Data Analysis Help", category: "Excel/Data", description: "Formulas, pivot tables, dashboards, and cleaning messy datasets for your reports and thesis work.", price: "120 THB/hr", rating: 4.7, reviews: 12, status: "Active" },
  { id: "s7", type: "service", name: "You", title: "Canva & Social Media Graphics", category: "Design", description: "I design Instagram posts, banners, and simple branding assets for club events and projects.", price: "100 THB/design", rating: 5.0, reviews: 3, status: "Active" },
];

const INITIAL_REQUESTS = [
  { id: "r1", type: "request", name: "Gap Sirinya", title: "Need help debugging a Python script", category: "Coding", description: "My sorting algorithm assignment keeps throwing an IndexError and I can't figure out why. Need it fixed before Friday.", budget: "100 THB", deadline: "Aug 21, 2026", status: "Open" },
  { id: "r2", type: "request", name: "Two Ratchanon", title: "Looking for someone to design a poster", category: "Design", description: "Need an A2 poster for our club's open house event. Have the content ready, just need it designed nicely.", budget: "250 THB", deadline: "Aug 25, 2026", status: "Open" },
  { id: "r3", type: "request", name: "Mind Pattarapon", title: "Need an English presentation proofread", category: "Writing", description: "10-slide presentation for my capstone review. Just need grammar and phrasing checked before Monday.", budget: "150 THB", deadline: "Aug 24, 2026", status: "Open" },
  { id: "r4", type: "request", name: "Aim Warisara", title: "Need a tutor for Statistics midterm", category: "Tutoring", description: "Struggling with hypothesis testing and regression. Looking for 2 sessions before the exam.", budget: "350 THB", deadline: "Aug 28, 2026", status: "Open" },
  { id: "r5", type: "request", name: "Job Kittisak", title: "Need product photos for a small shop", category: "Photography", description: "About 15 products to shoot with a plain background, need them by next week.", budget: "400 THB", deadline: "Aug 27, 2026", status: "Open" },
  { id: "r6", type: "request", name: "Fern Chayapa", title: "Need help building an Excel dashboard", category: "Excel/Data", description: "Have raw survey data and need it turned into charts and a summary dashboard for a group project.", budget: "200 THB", deadline: "Aug 23, 2026", status: "Open" },
  { id: "r7", type: "request", name: "You", title: "Need a tutor for Financial Accounting", category: "Tutoring", description: "Struggling with journal entries and adjusting entries before the quiz. Looking for one session this week.", budget: "150 THB", deadline: "Aug 22, 2026", status: "Open" },
];

/* ---------------- Small UI atoms ---------------- */

function Badge({ children, className = "" }) {
  return <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${className}`}>{children}</span>;
}

function CategoryBadge({ category }) {
  return <Badge className="bg-slate-100 text-slate-600">{category}</Badge>;
}

function StarRating({ rating, reviews }) {
  return (
    <div className="flex items-center gap-1 text-sm text-slate-500">
      <span className="text-amber-500">★</span>
      <span className="font-semibold text-slate-700">{rating}</span>
      <span>({reviews})</span>
    </div>
  );
}

function PrimaryButton({ children, onClick, className = "", type = "button", disabled = false }) {
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      className={`bg-blue-600 hover:bg-blue-700 active:scale-[.98] transition text-white font-semibold rounded-xl px-5 py-2.5 shadow-sm shadow-blue-600/20 ${className}`}>
      {children}
    </button>
  );
}

function GhostButton({ children, onClick, className = "" }) {
  return (
    <button onClick={onClick}
      className={`bg-white hover:bg-slate-50 active:scale-[.98] transition text-slate-700 font-semibold rounded-xl px-5 py-2.5 border border-slate-200 ${className}`}>
      {children}
    </button>
  );
}

/* ---------------- Navbar ---------------- */

function Navbar({ page, setPage, onPost }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const links = [
    { key: "home", label: "Home" },
    { key: "services", label: "Services" },
    { key: "requests", label: "Help Requests" },
    { key: "profile", label: "Profile" },
  ];
  const goTo = (key) => { setPage(key); setMenuOpen(false); };
  return (
    <div className="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-slate-100">
      <div className="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
        <button onClick={() => goTo("home")} className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-extrabold text-sm">W</div>
          <span className="font-extrabold text-lg tracking-tight">WORKLINK <span className="text-blue-600">SIIT</span></span>
        </button>
        <div className="hidden md:flex items-center gap-1">
          {links.map(l => (
            <button key={l.key} onClick={() => goTo(l.key)}
              className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${page === l.key ? "bg-blue-50 text-blue-700" : "text-slate-500 hover:text-slate-800 hover:bg-slate-50"}`}>
              {l.label}
            </button>
          ))}
        </div>
        <div className="flex items-center gap-2">
          <PrimaryButton onClick={onPost} className="!px-4 !py-2 text-sm">+ Post</PrimaryButton>
          <button onClick={() => setMenuOpen(o => !o)} aria-label="Toggle menu"
            className="md:hidden w-10 h-10 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600">
            {menuOpen ? "✕" : "☰"}
          </button>
        </div>
      </div>
      {menuOpen && (
        <div className="fade-in md:hidden border-t border-slate-100 bg-white px-5 py-3 flex flex-col gap-1">
          {links.map(l => (
            <button key={l.key} onClick={() => goTo(l.key)}
              className={`text-left px-4 py-2.5 rounded-lg text-sm font-semibold transition ${page === l.key ? "bg-blue-50 text-blue-700" : "text-slate-600 hover:bg-slate-50"}`}>
              {l.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Cards ---------------- */

function MatchedRibbon() {
  return (
    <div className="flex items-center gap-1 text-xs font-bold text-violet-700 bg-violet-50 px-2.5 py-1 rounded-full">
      <span>🎉</span> Matched
    </div>
  );
}

function ServiceCard({ item, onView, matched }) {
  return (
    <div className="fade-in bg-white rounded-2xl border border-slate-100 p-5 flex flex-col gap-3 hover:shadow-lg hover:shadow-slate-200/60 hover:-translate-y-0.5 transition">
      <div className="flex items-center justify-between gap-2">
        <div className="flex items-center gap-3 min-w-0">
          <Avatar name={item.name} />
          <div className="min-w-0">
            <p className="font-semibold text-sm truncate">{item.name}</p>
            <StarRating rating={item.rating} reviews={item.reviews} />
          </div>
        </div>
        {matched && <MatchedRibbon />}
      </div>
      <div>
        <h3 className="font-bold text-slate-900 leading-snug">{item.title}</h3>
        <p className="text-sm text-slate-500 mt-1 line-clamp-2">{item.description}</p>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <CategoryBadge category={item.category} />
        <Badge className="bg-blue-50 text-blue-700">{item.price}</Badge>
      </div>
      <PrimaryButton onClick={() => onView(item)} className="w-full mt-1 text-sm">
        {matched ? "Continue Chat" : "View"}
      </PrimaryButton>
    </div>
  );
}

function RequestCard({ item, onView, matched }) {
  return (
    <div className="fade-in bg-white rounded-2xl border border-slate-100 p-5 flex flex-col gap-3 hover:shadow-lg hover:shadow-slate-200/60 hover:-translate-y-0.5 transition">
      <div className="flex items-center justify-between gap-2">
        <div className="flex items-center gap-3 min-w-0">
          <Avatar name={item.name} />
          <div className="min-w-0">
            <p className="font-semibold text-sm truncate">{item.name}</p>
            <p className="text-xs text-slate-400">Deadline: {item.deadline}</p>
          </div>
        </div>
        {matched && <MatchedRibbon />}
      </div>
      <div>
        <h3 className="font-bold text-slate-900 leading-snug">{item.title}</h3>
        <p className="text-sm text-slate-500 mt-1 line-clamp-2">{item.description}</p>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <CategoryBadge category={item.category} />
        <Badge className="bg-emerald-50 text-emerald-700">Budget: {item.budget}</Badge>
      </div>
      <GhostButton onClick={() => onView(item)} className="w-full mt-1 text-sm !border-blue-200 !text-blue-700">
        {matched ? "Continue Chat" : "View"}
      </GhostButton>
    </div>
  );
}

/* ---------------- Search + Filter bar ---------------- */

function FilterBar({ query, setQuery, category, setCategory, placeholder }) {
  return (
    <div className="flex flex-col sm:flex-row gap-3 mb-6">
      <div className="relative flex-1">
        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">⌕</span>
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder={placeholder}
          className="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-9 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400" />
        {query && (
          <button type="button" onClick={() => setQuery("")} aria-label="Clear search"
            className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">✕</button>
        )}
      </div>
      <select value={category} onChange={e => setCategory(e.target.value)}
        className="bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400">
        <option value="All">All categories</option>
        {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
      </select>
    </div>
  );
}

/* ---------------- Home Page ---------------- */

function Home({ setPage, services, requests, openDetail, chats }) {
  return (
    <div className="fade-in">
      <div className="max-w-6xl mx-auto px-5 pt-16 pb-12 text-center">
        <div className="inline-block mb-4 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-bold tracking-wide">
          FOR SIIT STUDENTS, BY SIIT STUDENTS
        </div>
        <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900">
          WORKLINK <span className="text-blue-600">SIIT</span>
        </h1>
        <p className="mt-4 text-lg md:text-xl font-semibold text-slate-700">
          Help, from someone who gets it.
        </p>
        <p className="mt-3 max-w-xl mx-auto text-slate-500">
          Tired of help requests getting buried in LINE groups? WORKLINK gives SIIT students one
          dedicated place to connect students who need help with students who can help — coding,
          design, tutoring, proofreading, photography, Excel, and more.
        </p>
        <div className="mt-8 flex items-center justify-center gap-3 flex-wrap">
          <PrimaryButton onClick={() => setPage("services")} className="text-base">Browse Services</PrimaryButton>
          <GhostButton onClick={() => setPage("requests")} className="text-base">Find Help</GhostButton>
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-5 pb-10">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-bold text-lg">Popular services</h2>
          <button onClick={() => setPage("services")} className="text-sm font-semibold text-blue-600 hover:underline">See all →</button>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {services.slice(0, 3).map(s => <ServiceCard key={s.id} item={s} onView={openDetail} matched={!!chats[s.id]?.matched} />)}
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-5 pb-20">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-bold text-lg">Recent help requests</h2>
          <button onClick={() => setPage("requests")} className="text-sm font-semibold text-blue-600 hover:underline">See all →</button>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {requests.slice(0, 3).map(r => <RequestCard key={r.id} item={r} onView={openDetail} matched={!!chats[r.id]?.matched} />)}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Services / Requests list pages ---------------- */

function ServicesPage({ services, openDetail, chats }) {
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("All");
  const filtered = useMemo(() => services.filter(s =>
    (category === "All" || s.category === category) &&
    (s.title.toLowerCase().includes(query.toLowerCase()) || s.name.toLowerCase().includes(query.toLowerCase()) || s.description.toLowerCase().includes(query.toLowerCase()))
  ), [services, query, category]);

  return (
    <div className="fade-in max-w-6xl mx-auto px-5 py-10">
      <h1 className="text-2xl font-extrabold mb-1">Services</h1>
      <p className="text-slate-500 mb-6">Students offering their skills — "I can help".</p>
      <FilterBar query={query} setQuery={setQuery} category={category} setCategory={setCategory} placeholder="Search services, e.g. Python, Figma..." />
      {filtered.length === 0 ? (
        <EmptyState text="No services match your search." />
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map(s => <ServiceCard key={s.id} item={s} onView={openDetail} matched={!!chats[s.id]?.matched} />)}
        </div>
      )}
    </div>
  );
}

function RequestsPage({ requests, openDetail, chats }) {
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("All");
  const filtered = useMemo(() => requests.filter(r =>
    (category === "All" || r.category === category) &&
    (r.title.toLowerCase().includes(query.toLowerCase()) || r.name.toLowerCase().includes(query.toLowerCase()) || r.description.toLowerCase().includes(query.toLowerCase()))
  ), [requests, query, category]);

  return (
    <div className="fade-in max-w-6xl mx-auto px-5 py-10">
      <h1 className="text-2xl font-extrabold mb-1">Help Requests</h1>
      <p className="text-slate-500 mb-6">Students who need a hand — "I need help".</p>
      <FilterBar query={query} setQuery={setQuery} category={category} setCategory={setCategory} placeholder="Search requests, e.g. proofreading, poster..." />
      {filtered.length === 0 ? (
        <EmptyState text="No help requests match your search." />
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map(r => <RequestCard key={r.id} item={r} onView={openDetail} matched={!!chats[r.id]?.matched} />)}
        </div>
      )}
    </div>
  );
}

function EmptyState({ text }) {
  return (
    <div className="text-center py-20 text-slate-400">
      <div className="text-3xl mb-2">🔍</div>
      <p>{text}</p>
    </div>
  );
}

/* ---------------- Profile ---------------- */

function StatusBadge({ status }) {
  const styles = status === "Matched"
    ? "bg-violet-50 text-violet-700"
    : (status === "Open" || status === "Active")
      ? "bg-emerald-50 text-emerald-700"
      : status === "Fulfilled"
        ? "bg-blue-50 text-blue-700"
        : "bg-slate-100 text-slate-500";
  return <Badge className={styles}>{status}</Badge>;
}

function MyServiceCard({ item, onClick }) {
  return (
    <button onClick={() => onClick(item)}
      className="fade-in text-left bg-white rounded-2xl border border-slate-100 p-5 flex flex-col gap-3 hover:border-blue-300 hover:shadow-lg hover:shadow-slate-200/60 hover:-translate-y-0.5 transition">
      <div className="flex items-start justify-between gap-2">
        <h3 className="font-bold text-slate-900 leading-snug">{item.title}</h3>
        <StatusBadge status={item.status} />
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <CategoryBadge category={item.category} />
        <Badge className="bg-blue-50 text-blue-700">{item.price}</Badge>
      </div>
      <span className="text-xs font-semibold text-blue-600">Click to edit →</span>
    </button>
  );
}

function MyRequestCard({ item, onClick }) {
  return (
    <button onClick={() => onClick(item)}
      className="fade-in text-left bg-white rounded-2xl border border-slate-100 p-5 flex flex-col gap-3 hover:border-blue-300 hover:shadow-lg hover:shadow-slate-200/60 hover:-translate-y-0.5 transition">
      <div className="flex items-start justify-between gap-2">
        <h3 className="font-bold text-slate-900 leading-snug">{item.title}</h3>
        <StatusBadge status={item.status} />
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <CategoryBadge category={item.category} />
        <Badge className="bg-emerald-50 text-emerald-700">Budget: {item.budget}</Badge>
      </div>
      <p className="text-xs text-slate-400">Deadline: {item.deadline}</p>
      <span className="text-xs font-semibold text-blue-600">Click to edit →</span>
    </button>
  );
}

function ChatHistoryCard({ entry, onOpen }) {
  const { item, messages, matched } = entry;
  const lastMessage = messages[messages.length - 1];
  return (
    <button onClick={() => onOpen(item)}
      className="fade-in text-left bg-white rounded-2xl border border-slate-100 p-5 flex flex-col gap-2 hover:border-blue-300 hover:shadow-lg hover:shadow-slate-200/60 hover:-translate-y-0.5 transition">
      <div className="flex items-start justify-between gap-2">
        <div className="flex items-center gap-2 min-w-0">
          <Avatar name={item.name} size="w-8 h-8 text-xs" />
          <div className="min-w-0">
            <p className="font-bold text-sm truncate">{item.title}</p>
            <p className="text-xs text-slate-400">with {item.name}</p>
          </div>
        </div>
        {matched ? <StatusBadge status="Matched" /> : <CategoryBadge category={item.category} />}
      </div>
      {lastMessage && (
        <p className="text-sm text-slate-500 line-clamp-1">
          <span className="font-semibold text-slate-600">{lastMessage.from === "me" ? "You: " : ""}</span>
          {lastMessage.text}
        </p>
      )}
    </button>
  );
}

function ProfilePage({ services, requests, chats, onEditService, onEditRequest, onOpenChat }) {
  const myServices = services.filter(s => s.name === CURRENT_USER.name);
  const myRequests = requests.filter(r => r.name === CURRENT_USER.name);
  const chatEntries = Object.values(chats);

  return (
    <div className="fade-in max-w-6xl mx-auto px-5 py-10">
      <div className="bg-white rounded-2xl border border-slate-100 p-6 flex items-center gap-5 flex-wrap">
        <Avatar name={CURRENT_USER.name} size="w-16 h-16 text-lg" />
        <div>
          <h1 className="text-xl font-extrabold">{CURRENT_USER.name}</h1>
          <p className="text-sm text-slate-500">{CURRENT_USER.program}</p>
          <div className="mt-1">
            <StarRating rating={CURRENT_USER.rating} reviews={CURRENT_USER.reviews} />
          </div>
        </div>
      </div>

      <div className="mt-10">
        <h2 className="font-bold text-lg mb-4">My Services</h2>
        {myServices.length === 0 ? (
          <EmptyState text="You haven't posted any services yet." />
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {myServices.map(s => <MyServiceCard key={s.id} item={s} onClick={onEditService} />)}
          </div>
        )}
      </div>

      <div className="mt-10">
        <h2 className="font-bold text-lg mb-4">My Help Requests</h2>
        {myRequests.length === 0 ? (
          <EmptyState text="You haven't posted any help requests yet." />
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">

const inputCls = "w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400";

function formatDate(date) {
  return date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function sameDay(a, b) {
  return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function DatePicker({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState({ top: 0, left: 0, flip: false });
  const selected = value ? new Date(value) : null;
  const validSelected = selected && !isNaN(selected) ? selected : null;
  const [viewDate, setViewDate] = useState(validSelected ? new Date(validSelected.getFullYear(), validSelected.getMonth(), 1) : new Date());
  const btnRef = useRef(null);
  const panelRef = useRef(null);

  useEffect(() => {
    const handleOutside = (e) => {
      if (panelRef.current && panelRef.current.contains(e.target)) return;
      if (btnRef.current && btnRef.current.contains(e.target)) return;
      setOpen(false);
    };
    const handleReflow = () => setOpen(false);
    document.addEventListener("mousedown", handleOutside);
    window.addEventListener("resize", handleReflow);
    window.addEventListener("scroll", handleReflow, true);
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      window.removeEventListener("resize", handleReflow);
      window.removeEventListener("scroll", handleReflow, true);
    };
  }, []);

  const CAL_W = 288;
  const CAL_H = 336;

  const togglePicker = () => {
    if (!open && btnRef.current) {
      const rect = btnRef.current.getBoundingClientRect();
      let left = rect.left;
      if (left + CAL_W > window.innerWidth - 12) left = Math.max(12, window.innerWidth - CAL_W - 12);
      const fitsBelow = rect.bottom + 8 + CAL_H <= window.innerHeight - 12;
      const top = fitsBelow ? rect.bottom + 8 : Math.max(12, rect.top - CAL_H - 8);
      setPos({ top, left, flip: !fitsBelow });
    }
    setOpen(o => !o);
  };

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [...Array(firstWeekday).fill(null), ...Array(daysInMonth).keys()].map((d, i) => (d === null ? null : d + 1));

  const pick = (day) => {
    onChange(formatDate(new Date(year, month, day)));
    setOpen(false);
  };

  return (
    <React.Fragment>
      <button ref={btnRef} type="button" onClick={togglePicker}
        className={`${inputCls} flex items-center justify-between text-left ${!value ? "text-slate-400" : "text-slate-900"}`}>
        <span>{value || "Select a date"}</span>
        <span aria-hidden="true">📅</span>
      </button>
      {open && (
        <div ref={panelRef} style={{ position: "fixed", top: pos.top, left: pos.left, width: CAL_W }}
          className="pop-in z-[70] bg-white rounded-2xl border border-slate-200 shadow-2xl p-4">
          <div className="flex items-center justify-between mb-3">
            <button type="button" onClick={() => setViewDate(new Date(year, month - 1, 1))}
              className="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-500 font-bold">‹</button>
            <p className="font-bold text-sm">{viewDate.toLocaleDateString("en-US", { month: "long", year: "numeric" })}</p>
            <button type="button" onClick={() => setViewDate(new Date(year, month + 1, 1))}
              className="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-500 font-bold">›</button>
          </div>
          <div className="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-1">
            {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => <div key={i}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((day, i) => {
              if (day === null) return <div key={i} />;
              const date = new Date(year, month, day);
              const isPast = date < today;
              const isSelected = sameDay(date, validSelected);
              const isToday = sameDay(date, today);
              return (
                <button type="button" key={i} disabled={isPast} onClick={() => pick(day)}
                  className={`w-9 h-9 rounded-lg text-sm font-medium transition
                    ${isSelected ? "bg-blue-600 text-white" : isPast ? "text-slate-300 cursor-not-allowed" : "text-slate-700 hover:bg-blue-50"}
                    ${isToday && !isSelected ? "ring-1 ring-inset ring-blue-400" : ""}`}>
                  {day}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function DetailPage({ item, chatEntry, onUpdateChat, onBack }) {
  const isService = item.type === "service";
  const isOwnPost = item.name === CURRENT_USER.name;
  const [messages, setMessages] = useState(chatEntry ? chatEntry.messages : [
    { from: "them", text: isService
        ? `Hi! Thanks for checking out my post. Feel free to ask me anything about "${item.title}".`
        : `Hi! This is about "${item.title}". Let me know if you have questions before we get started.` },
  ]);
  const [draft, setDraft] = useState("");
  const [matched, setMatched] = useState(chatEntry ? chatEntry.matched : false);
  const [justMatched, setJustMatched] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  const send = () => {
    if (!draft.trim()) return;
    const withMe = [...messages, { from: "me", text: draft.trim() }];
    setMessages(withMe);
    onUpdateChat(item, withMe, matched);
    setDraft("");
    setTimeout(() => {
      setMessages(m => {
        const withReply = [...m, { from: "them", text: "Sounds good, let's figure out the details 🙂" }];
        onUpdateChat(item, withReply, matched);
        return withReply;
      });
    }, 700);
  };

  const handleMatch = () => {
    setMatched(true);
    setJustMatched(true);
    onUpdateChat(item, messages, true);
  };

  return (
    <div className="fade-in max-w-2xl mx-auto px-5 py-10">
      <button onClick={onBack} className="mb-6 inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800 transition">
        <span aria-hidden="true">←</span> Back
      </button>

      {justMatched ? (
        <div className="pop-in bg-white rounded-3xl border border-slate-100 p-10 text-center">
          <div className="text-5xl mb-4">🎉</div>
          <h1 className="text-2xl font-extrabold mb-1">It's a match!</h1>
          <p className="text-slate-500 mb-6">You can now work together.</p>
          <PrimaryButton onClick={onBack}>Done</PrimaryButton>
        </div>
      ) : (
        <div className="bg-white rounded-3xl border border-slate-100 p-6 sm:p-8">
          <div className="flex items-center gap-3 mb-3">
            <Avatar name={item.name} size="w-12 h-12 text-base" />
            <div>
              <h1 className="text-xl font-extrabold leading-snug">{item.title}</h1>
              <p className="text-sm text-slate-500">{isOwnPost ? "You" : item.name}</p>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap mb-3">
            <CategoryBadge category={item.category} />
            {isService
              ? <Badge className="bg-blue-50 text-blue-700">{item.price}</Badge>
              : <Badge className="bg-emerald-50 text-emerald-700">Budget: {item.budget}</Badge>}
          </div>
          <p className="text-sm text-slate-600 mb-2">{item.description}</p>
          {!isService && <p className="text-xs text-slate-400 mb-4">Deadline: {item.deadline}</p>}

          {isOwnPost ? (
            <div className="mt-4 bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-500">
              This is one of your own posts. Head to your <span className="font-semibold text-slate-700">Profile</span> to edit or manage it.
            </div>
          ) : (
            <React.Fragment>
              {matched && (
                <div className="mt-4 mb-4 flex items-center gap-2 bg-violet-50 border border-violet-100 rounded-xl px-4 py-2.5 text-sm text-violet-700 font-semibold">
                  <span>🎉</span> You matched on this — chat below to coordinate.
                </div>
              )}
              <div className={`border border-slate-200 rounded-2xl overflow-hidden ${matched ? "" : "mt-4"}`}>
                <div className="bg-slate-50 px-4 py-2 text-xs font-bold text-slate-500 uppercase tracking-wide">Chat</div>
                <div ref={scrollRef} className="h-64 overflow-y-auto px-4 py-3 space-y-2 bg-white">
                  {messages.map((m, i) => (
                    <div key={i} className={`flex ${m.from === "me" ? "justify-end" : "justify-start"}`}>
                      <div className={`max-w-[75%] rounded-2xl px-3.5 py-2 text-sm ${m.from === "me" ? "bg-blue-600 text-white rounded-br-sm" : "bg-slate-100 text-slate-700 rounded-bl-sm"}`}>
                        {m.text}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="flex items-center gap-2 border-t border-slate-100 p-2">
                  <input
                    value={draft}
                    onChange={e => setDraft(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && send()}
                    placeholder="Type a message..."
                    className="flex-1 text-sm px-3 py-2 rounded-lg bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500/30" />
                  <button onClick={send} disabled={!draft.trim()}
                    className="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-lg px-4 py-2 text-sm font-semibold">Send</button>
                </div>
              </div>

              {matched ? (
                <GhostButton className="w-full mt-5 !text-violet-700 !border-violet-200 cursor-default" onClick={() => {}}>
                  Matched ✓
                </GhostButton>
              ) : (
                <PrimaryButton onClick={handleMatch} className="w-full mt-5">
                  {isService ? "Request Help" : "Offer to Help"}
                </PrimaryButton>
              )}
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

    <div>
      <Navbar page={page} setPage={setPage} onPost={openPost} />

      {page === "home" && <Home setPage={setPage} services={services} requests={requests} openDetail={openDetail} chats={chats} />}
      {page === "services" && <ServicesPage services={services} openDetail={openDetail} chats={chats} />}
      {page === "requests" && <RequestsPage requests={requests} openDetail={openDetail} chats={chats} />}
      {page === "profile" && (
        <ProfilePage
          services={services}
          requests={requests}
          chats={chats}
          onEditService={openEditService}
          onEditRequest={openEditRequest}
          onOpenChat={openDetail}
        />
      )}
      {page === "detail" && detailItem && (
        <DetailPage
          item={detailItem}
          chatEntry={chats[detailItem.id]}
          onUpdateChat={updateChat}
          onBack={backFromDetail}
        />
      )}

      {showChooser && <PostChooser onClose={closePostFlow} onChoose={chooseType} />}
      {formType === "service" && <ServiceForm onClose={closePostFlow} onSubmit={submitService} />}
      {formType === "request" && <RequestForm onClose={closePostFlow} onSubmit={submitRequest} />}
      {editTarget?.type === "service" && <EditServiceForm item={editTarget.item} onClose={closeEdit} onSave={saveService} onDelete={deleteService} />}
      {editTarget?.type === "request" && <EditRequestForm item={editTarget.item} onClose={closeEdit} onSave={saveRequest} onDelete={deleteRequest} />}

      <footer className="text-center text-xs text-slate-400 py-10">
        WORKLINK SIIT · Built for SIIT students, by SIIT students.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
