function useRouter() {
  const [path, setPath] = useState(window.location.pathname || "/");
  useEffect(() => {
    const onPop = () => setPath(window.location.pathname || "/");
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  const nav = (to) => {
    if (to !== window.location.pathname) {
      window.history.pushState({}, "", to);
      setPath(to);
    }
    window.scrollTo({ top: 0, behavior: "instant" });
  };
  return [path, nav];
}

function Link({ to, nav, className, children }) {
  return (
    <a href={to} className={className} onClick={(e) => { e.preventDefault(); nav(to); }}>
      {children}
    </a>
  );
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

function ChatCard({ item, messages, onSend, matchStatus, matchedAt, onRequestMatch, onCancelMatch, matchLabel }) {
  const [draft, setDraft] = useState("");
  const scrollRef = useRef(null);
  const firstName = item.name.split(" ")[0];

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  const send = () => {
    if (!draft.trim()) return;
    onSend(draft.trim());
    setDraft("");
  };

  return (
    <div className="mt-8">
      <h2 className="mb-3 text-lg font-semibold">Chat with {item.name}</h2>
      <div className="rounded-2xl border shadow-sm" style={{ borderColor: "var(--border)", background: "var(--card)" }}>
        <div className="flex items-center gap-3 border-b px-5 py-4" style={{ borderColor: "var(--border)" }}>
          <Avatar initials={item.initials} size={36} radius="full" tone="tint" />
          <div>
            <div className="text-sm font-semibold">{item.name}</div>
            <div className="text-xs muted">Usually replies within an hour</div>
          </div>
        </div>
        <div ref={scrollRef} className="flex flex-col gap-3 overflow-y-auto px-5 py-4" style={{ maxHeight: "20rem" }}>
          {messages.map((m, i) => (
            <div key={i} className={`max-w-[80%] rounded-2xl px-4 py-2.5 text-sm ${m.from === "me" ? "chat-bubble-me self-end" : "chat-bubble-them self-start"}`}>{m.text}</div>
          ))}
        </div>
        <form onSubmit={e => { e.preventDefault(); send(); }} className="flex items-center gap-2 border-t px-4 py-3" style={{ borderColor: "var(--border)" }}>
          <input value={draft} onChange={e => setDraft(e.target.value)} placeholder="Discuss the task..." className="field-input" style={{ flex: 1 }} />
          <button type="submit" disabled={!draft.trim()} className="btn btn-primary btn-icon" aria-label="Send message">
            <SendIcon className="h-4 w-4" />
          </button>
        </form>
        {onRequestMatch && (
        <div className="border-t px-5 py-4" style={{ borderColor: "var(--border)" }}>
          {matchStatus === "pending" ? (
            <div className="fade-in">
              <div className="flex items-center gap-2 text-sm font-semibold" style={{ color: "var(--primary)" }}>
                <CheckIcon className="h-4 w-4" /> Request sent to {item.name}
              </div>
              <p className="mt-0.5 text-xs muted">{formatTime(matchedAt)}</p>
              <button disabled className="btn btn-primary btn-block mt-3">Request sent — waiting for reply</button>
              <ul className="mt-3 space-y-1.5 text-xs muted">
                <li className="flex items-start gap-1.5"><span aria-hidden="true">•</span><span>{firstName} usually replies within an hour</span></li>
                <li className="flex items-start gap-1.5"><span aria-hidden="true">•</span><span>You'll sort out price and scope in chat</span></li>
                <li className="flex items-start gap-1.5"><span aria-hidden="true">•</span><span>Either of you can cancel before work starts</span></li>
              </ul>
              <button onClick={onCancelMatch} className="mt-3 w-full text-center text-sm font-semibold muted" style={{ background: "none", border: "none", cursor: "pointer" }}>
                Cancel request
              </button>
            </div>
          ) : matchStatus === "active" ? (
            <div className="fade-in">
              <div className="flex items-center gap-2 text-sm font-semibold" style={{ color: "var(--primary)" }}>
                <CheckIcon className="h-4 w-4" /> Connected with {item.name}

              <button onClick={onCancelMatch} className="mt-3 w-full text-center text-sm font-semibold muted" style={{ background: "none", border: "none", cursor: "pointer" }}>

          ) : (

      </div>
    </div>
  );
}

  if (!item) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-20 text-center sm:px-6 lg:px-8">
        <p className="muted">Service not found.</p>
        <Link to="/" nav={nav} className="btn btn-outline mt-4 inline-flex">Back to services</Link>
      </div>
    );
  }

  return (
    <div className="fade-in mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8">
      <Link to="/" nav={nav} className="inline-flex items-center gap-2 text-sm font-medium transition muted">
        <ArrowLeftIcon className="h-4 w-4" /> Back to services
      </Link>

      <div className="mt-6 rounded-2xl border p-6 shadow-sm sm:p-8" style={{ borderColor: "var(--border)", background: "var(--card)" }}>
        <div className="flex items-start gap-4">
          <Avatar initials={item.initials} size={64} radius="2xl" tone="solid" />
          <div className="flex-1">
            <span className="badge">{item.category}</span>
            <h1 className="mt-2 text-2xl font-bold sm:text-3xl">{item.title}</h1>
            <p className="mt-1 text-sm muted">Offered by {item.name}</p>
          </div>
        </div>

        <div className="mt-6 grid gap-4 sm:grid-cols-3">
          <div className="stat-tile">
            <div className="text-xs font-medium muted">Starting price</div>
            <div className="mt-1 text-lg font-semibold">{item.price}</div>
          </div>
          <div className="stat-tile">
            <div className="text-xs font-medium muted">Rating</div>
            <div className="mt-1 flex items-center gap-1 text-lg font-semibold">
              <StarIcon className="h-5 w-5" /> {item.rating.toFixed(1)} <span className="text-xs font-normal muted">({item.reviews})</span>
            </div>
          </div>
          <div className="stat-tile">
            <div className="text-xs font-medium muted">Student</div>
            <div className="mt-1 flex items-center gap-2 text-lg font-semibold">
              <UserIcon className="h-4 w-4 muted" /> {item.name}
            </div>
          </div>
        </div>

        <div className="mt-6">
          <h2 className="text-sm font-semibold">About this service</h2>
          <p className="mt-2 text-sm leading-relaxed muted">{item.description}</p>
        </div>
      </div>

      {isOwn ? (
        <div className="own-post-notice mt-8">
          <UserCircleIcon className="h-5 w-5 shrink-0" style={{ color: "var(--primary)" }} />
          This is your listing. Head to your <Link to="/profile" nav={nav} className="link-btn">Profile</Link> to manage it.
        </div>
      ) : (
        <ChatCard
          item={item}
          messages={chat ? chat.messages : [{ from: "them", text: opener }]}
          onSend={(text) => onSendMessage("service", item, text)}
          matchStatus={match && match.status}
          matchedAt={match && match.timestamp}
          onRequestMatch={() => onRequestMatch("service", item)}
          onCancelMatch={() => onCancelMatch("service", item)}
          matchLabel="Match with this student"
        />
      )}
    </div>
  );
}

function RequestDetail({ slug, nav, requests, chats, onEnsureChat, onSendMessage }) {
  const item = requests.find(r => r.slug === slug);
  const key = `request:${slug}`;
  const chat = chats[key];
  const isOwn = item && item.name === MOCK_USER.name;
  const opener = item ? `Hi! Thanks for checking out my request — "${item.title}". Can you help?` : "";

  useEffect(() => {
    if (item) onEnsureChat("request", item, opener);
  }, [item && item.slug]);

  if (!item) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-20 text-center sm:px-6 lg:px-8">
        <p className="muted">Request not found.</p>
        <Link to="/requests" nav={nav} className="btn btn-outline mt-4 inline-flex">Back to help requests</Link>
      </div>
    );
  }

  return (
    <div className="fade-in mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8">
      <Link to="/requests" nav={nav} className="inline-flex items-center gap-2 text-sm font-medium transition muted">
        <ArrowLeftIcon className="h-4 w-4" /> Back to help requests
      </Link>

      <div className="mt-6 rounded-2xl border p-6 shadow-sm sm:p-8" style={{ borderColor: "var(--border)", background: "var(--card)" }}>
        <div className="flex items-start gap-4">
          <Avatar initials={item.initials} size={56} radius="full" tone="tint" />
          <div className="flex-1">
            <span className="badge">{item.category}</span>
            <h1 className="mt-2 text-2xl font-bold sm:text-3xl">{item.title}</h1>
            <p className="mt-1 text-sm muted">Posted by {item.name}</p>
          </div>
        </div>

        <div className="mt-6 grid gap-4 sm:grid-cols-2">
          <div className="stat-tile">
            <div className="flex items-center gap-2 text-xs font-medium muted"><WalletIcon className="h-4 w-4" /> Budget</div>
            <div className="mt-1 text-lg font-semibold">{item.budget}</div>
          </div>
          <div className="stat-tile">
            <div className="flex items-center gap-2 text-xs font-medium muted"><CalendarIcon className="h-4 w-4" /> Deadline</div>
            <div className="mt-1 text-lg font-semibold">{item.deadline}</div>
          </div>
        </div>

        <div className="mt-6">
          <h2 className="text-sm font-semibold">What they need</h2>
          <p className="mt-2 text-sm leading-relaxed muted">{item.description}</p>
        </div>
      </div>

      {isOwn ? (
        <div className="own-post-notice mt-8">
          <UserCircleIcon className="h-5 w-5 shrink-0" style={{ color: "var(--primary)" }} />
          This is your request. Head to your <Link to="/profile" nav={nav} className="link-btn">Profile</Link> to see who's offering to help.
        </div>
      ) : (
        <ChatCard
          item={item}
          messages={chat ? chat.messages : [{ from: "them", text: opener }]}
          onSend={(text) => onSendMessage("request", item, text)}
        />
      )}
    </div>
  );
}

function ProfilePage({ nav, services, requests, matches, chats }) {
  const [tab, setTab] = useState("posts");

  const myServices = services.filter(s => s.name === MOCK_USER.name);
  const myRequests = requests.filter(r => r.name === MOCK_USER.name);
  const matchList = Object.values(matches).sort((a, b) => b.timestamp - a.timestamp);
  const chatList = Object.values(chats)
    .filter(c => c.messages.length > 0)
    .map(c => ({ ...c, last: c.messages[c.messages.length - 1] }))
    .sort((a, b) => (b.last ? b.last.time : 0) - (a.last ? a.last.time : 0));

  const detailPath = (row) => row.type === "service" ? `/service/${row.slug}` : `/requests/${row.slug}`;
  const rowInitials = (name) => name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();

  return (
    <div className="fade-in mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:px-8">
      <div className="flex items-center gap-4">
        <Avatar initials={MOCK_USER.initials} size={56} radius="full" tone="solid" />
        <div>
          <h1 className="text-2xl font-bold">{MOCK_USER.name}</h1>
          <p className="text-sm muted">Your posts, matches, and chat history</p>
        </div>
      </div>

      <div className="tab-bar mt-8">
        <button className={`tab-btn ${tab === "posts" ? "active" : ""}`} onClick={() => setTab("posts")}>My Posts</button>
        <button className={`tab-btn ${tab === "matches" ? "active" : ""}`} onClick={() => setTab("matches")}>My Matches</button>
        <button className={`tab-btn ${tab === "chats" ? "active" : ""}`} onClick={() => setTab("chats")}>My Chats</button>
      </div>

      {tab === "posts" && (
        <div className="space-y-10">
          <div>
            <h2 className="mb-4 text-lg font-semibold">Services you offer</h2>
            {myServices.length === 0 ? (
              <EmptyState text="You haven't posted a service yet." />
            ) : (
              <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
                {myServices.map(s => <ServiceCard key={s.slug} item={s} nav={nav} />)}
              </div>
            )}
          </div>
          <div>
            <h2 className="mb-4 text-lg font-semibold">Help requests you posted</h2>
            {myRequests.length === 0 ? (
              <EmptyState text="You haven't posted a help request yet." />
            ) : (
              <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
                {myRequests.map(r => <RequestCard key={r.slug} item={r} nav={nav} />)}
              </div>
            )}
          </div>
        </div>
      )}

      {tab === "matches" && (
        matchList.length === 0 ? (
          <EmptyState text="No matches yet — request a service to get started." />
        ) : (
          <div className="space-y-3">
            {matchList.map(m => (
              <Link key={m.key} to={detailPath(m)} nav={nav} className="list-row">
                <Avatar initials={rowInitials(m.name)} size={40} radius="full" tone="tint" />
                <div className="min-w-0 flex-1">
                  <p className="truncate text-sm font-semibold">{m.title}</p>
                  <p className="text-xs muted">Matched with {m.name} · {formatTime(m.timestamp)}</p>
                </div>
                <span className={`status-badge status-${m.status}`}>{m.status.charAt(0).toUpperCase() + m.status.slice(1)}</span>
              </Link>
            ))}
          </div>
        )
      )}

      {tab === "chats" && (
        chatList.length === 0 ? (
          <EmptyState text="No conversations yet." />
        ) : (
          <div className="space-y-3">
            {chatList.map(c => (
              <Link key={c.key} to={detailPath(c)} nav={nav} className="list-row">
                <Avatar initials={rowInitials(c.name)} size={40} radius="full" tone="tint" />
                <div className="min-w-0 flex-1">
                  <p className="truncate text-sm font-semibold">{c.name}</p>
                  <p className="truncate text-xs muted">{c.last ? (c.last.from === "me" ? "You: " : "") + c.last.text : "No messages yet"}</p>
                </div>
                <span className="shrink-0 text-xs muted">{c.last ? formatTime(c.last.time) : ""}</span>
              </Link>
            ))}
          </div>
        )
      )}
    </div>
  );
}

function NotFound({ nav }) {
  return (
    <div className="mx-auto max-w-lg px-4 py-20 text-center sm:px-6 lg:px-8">
      <h1 className="text-2xl font-extrabold">Page not found</h1>
      <Link to="/" nav={nav} className="btn btn-primary mt-6 inline-flex">Back to Services</Link>
    </div>
  );
}

/* ---------------- Shell ---------------- */

function Header({ path, nav }) {
  const servicesActive = path === "/" || path.startsWith("/service/");
  const requestsActive = path === "/requests" || path.startsWith("/requests/");
  const profileActive = path === "/profile";
  return (
    <header className="sticky top-0 z-40 w-full border-b" style={{ borderColor: "var(--border)", background: "color-mix(in oklch, var(--background) 80%, transparent)", backdropFilter: "blur(8px)" }}>
      <div className="mx-auto flex h-16 max-w-7xl items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
        <Link to="/" nav={nav} className="flex items-center gap-2.5" style={{ flexShrink: 0 }}>
          <div className="flex h-9 w-9 items-center justify-center rounded-lg" style={{ background: "var(--primary)", color: "var(--primary-foreground)" }}>
            <HandHelpingIcon className="h-5 w-5" />
          </div>
          <div className="flex flex-col">
            <span className="text-sm font-extrabold leading-none tracking-tight">WORKLINK</span>
            <span className="text-[10px] font-semibold uppercase leading-none tracking-widest" style={{ color: "var(--primary)" }}>SIIT</span>
          </div>
        </Link>
        <nav className="header-nav">
          <Link to="/" nav={nav} className={`nav-link ${servicesActive ? "active" : ""}`}>Services</Link>
          <Link to="/requests" nav={nav} className={`nav-link ${requestsActive ? "active" : ""}`}>Help Requests</Link>
          <Link to="/profile" nav={nav} className="profile-nav-link" title="Profile">
            <Avatar initials={MOCK_USER.initials} size={30} radius="full" tone={profileActive ? "solid" : "tint"} />
            <span className="sr-only">Profile</span>
          </Link>
          <Link to="/post" nav={nav} className="nav-post"><PlusIcon className="h-4 w-4" /> Post</Link>
        </nav>
      </div>
    </header>
  );
}

function App() {
  const [path, nav] = useRouter();

  const [services, setServices] = useState(INITIAL_SERVICES);
  const [requests, setRequests] = useState(INITIAL_REQUESTS);
  const [servicesFilter, setServicesFilter] = useState({ query: "", category: "All" });
  const [requestsFilter, setRequestsFilter] = useState({ query: "", category: "All" });
  const [matches, setMatches] = useState(INITIAL_MATCHES); // key `${type}:${slug}` -> { key, type, slug, name, title, status, timestamp }
  const [chats, setChats] = useState(INITIAL_CHATS); // key -> { key, type, slug, name, title, messages: [{from, text, time}] }

  const addService = (form) => {
    const item = { slug: slugify(form.title), name: MOCK_USER.name, initials: MOCK_USER.initials, category: form.category, title: form.title.trim(), description: form.description.trim(), price: form.price.trim() || "Contact for price", rating: 5.0, reviews: 0 };
    setServices(s => [item, ...s]);
    return item;
  };
  const addRequest = (form) => {
    const deadline = form.deadline ? new Date(`${form.deadline}T00:00:00`).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) : "Flexible";
    const item = { slug: slugify(form.title), name: MOCK_USER.name, initials: MOCK_USER.initials, category: form.category, title: form.title.trim(), description: form.description.trim(), budget: form.budget.trim() || "Open to offers", deadline };
    setRequests(r => [item, ...r]);
    return item;
  };

  const requestMatch = (type, item) => {
    const key = `${type}:${item.slug}`;
    setMatches(m => ({ ...m, [key]: { key, type, slug: item.slug, name: item.name, title: item.title, status: "pending", timestamp: Date.now() } }));
  };
  const cancelMatch = (type, item) => {
    const key = `${type}:${item.slug}`;
    setMatches(m => ({ ...m, [key]: { ...m[key], status: "cancelled" } }));
  };

  const ensureChat = (type, item, opener) => {
    const key = `${type}:${item.slug}`;
    setChats(c => c[key] ? c : { ...c, [key]: { key, type, slug: item.slug, name: item.name, title: item.title, messages: [{ from: "them", text: opener, time: Date.now() }] } });
  };
  const sendMessage = (type, item, text) => {
    const key = `${type}:${item.slug}`;
    setChats(c => ({ ...c, [key]: { ...c[key], messages: [...c[key].messages, { from: "me", text, time: Date.now() }] } }));
    setTimeout(() => {
      setChats(c => c[key] ? { ...c, [key]: { ...c[key], messages: [...c[key].messages, { from: "them", text: "Sounds good — let's sort out the details.", time: Date.now() }] } } : c);
      setMatches(m => (m[key] && m[key].status === "pending") ? { ...m, [key]: { ...m[key], status: "active" } } : m);
    }, 700);
  };

  let page;
  if (path === "/") page = <ServicesPage nav={nav} services={services} filter={servicesFilter} onFilterChange={setServicesFilter} />;
  else if (path === "/requests") page = <RequestsPage nav={nav} requests={requests} filter={requestsFilter} onFilterChange={setRequestsFilter} />;
  else if (path.startsWith("/requests/")) page = <RequestDetail slug={path.replace("/requests/", "")} nav={nav} requests={requests} chats={chats} onEnsureChat={ensureChat} onSendMessage={sendMessage} />;
  else if (path === "/post") page = <PostPage nav={nav} />;
  else if (path === "/post/service") page = <PostServiceForm nav={nav} onSubmit={addService} />;
  else if (path === "/post/request") page = <PostRequestForm nav={nav} onSubmit={addRequest} />;
  else if (path === "/profile") page = <ProfilePage nav={nav} services={services} requests={requests} matches={matches} chats={chats} />;
  else if (path.startsWith("/service/")) page = <ServiceDetail slug={path.replace("/service/", "")} nav={nav} services={services} matches={matches} chats={chats} onRequestMatch={requestMatch} onCancelMatch={cancelMatch} onEnsureChat={ensureChat} onSendMessage={sendMessage} />;
  else page = <NotFound nav={nav} />;

  return (
    <div className="min-h-screen" style={{ background: "var(--background)" }}>
      <Header path={path} nav={nav} />
      <main>{page}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
