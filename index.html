<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WORKLINK SIIT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --background: oklch(99% .005 95);
    --foreground: oklch(15% .02 260);
    --primary: oklch(55% .18 250);
    --primary-foreground: oklch(100% 0 0);
    --secondary: oklch(95% .02 250);
    --secondary-foreground: oklch(15% .02 260);
    --muted: oklch(96% .01 250);
    --muted-foreground: oklch(55% .04 260);
    --card: oklch(100% 0 0);
    --card-foreground: oklch(15% .02 260);
    --border: oklch(90% .01 250);
    --ring: oklch(55% .18 250);
    --star: oklch(79% .17 70);
    --tint-10: color-mix(in oklch, var(--primary) 10%, transparent);
    --tint-20: color-mix(in oklch, var(--primary) 20%, var(--border));
    --overlay-90: color-mix(in oklch, white 90%, transparent);
    --overlay-40: color-mix(in oklch, white 40%, transparent);
    --overlay-10: color-mix(in oklch, white 10%, transparent);
    --primary-fg-80: color-mix(in oklch, var(--primary-foreground) 80%, transparent);
    --secondary-hover: color-mix(in oklch, var(--secondary) 70%, var(--muted));
  }
  * { font-family: 'Inter', system-ui, -apple-system, sans-serif; box-sizing: border-box; }
  body { background: var(--background); color: var(--foreground); margin: 0; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  .fade-in { animation: fadeIn .3s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  .nav-link { padding:.375rem .75rem; border-radius:999px; font-size:.875rem; font-weight:500; color:var(--muted-foreground); transition:.15s; text-decoration:none; }
  .nav-link:hover { background:var(--secondary); color:var(--foreground); }
  .nav-link.active { background:var(--secondary); color:var(--foreground); font-weight:600; }
  .nav-post { margin-left:.25rem; display:inline-flex; align-items:center; gap:.4rem; border-radius:999px; padding:.55rem 1.1rem; font-size:.875rem; font-weight:600; background:var(--primary); color:var(--primary-foreground); box-shadow:0 1px 2px oklch(15% .02 260 / .06); transition:.15s; text-decoration:none; }
  .nav-post:hover { filter:brightness(1.08); }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.45rem; border-radius:999px; font-weight:600; font-size:.875rem; padding:.7rem 1.4rem; transition:.15s; cursor:pointer; border:1px solid transparent; white-space:nowrap; text-decoration:none; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-primary { background:var(--primary); color:var(--primary-foreground); box-shadow:0 1px 2px oklch(15% .02 260 / .06); }
  .btn-primary:hover:not(:disabled) { filter:brightness(1.08); }
  .btn-outline { background:transparent; color:var(--foreground); border-color:var(--border); }
  .btn-outline:hover:not(:disabled) { background:var(--secondary); }
  .btn-white { background:white; color:var(--primary); }
  .btn-white:hover { background:var(--overlay-90); }
  .btn-outline-light { background:transparent; color:var(--primary-foreground); border-color:var(--overlay-40); }
  .btn-outline-light:hover { background:var(--overlay-10); }
  .btn-block { width:100%; }
  .btn-icon { padding:0; width:2.5rem; height:2.5rem; border-radius:.75rem; flex-shrink:0; }

  .pill { padding:.55rem 1.1rem; border-radius:999px; font-size:.875rem; font-weight:500; background:var(--secondary); color:var(--secondary-foreground); white-space:nowrap; cursor:pointer; border:none; transition:.15s; }
  .pill:hover { background:var(--secondary-hover); }
  .pill.active { background:var(--primary); color:var(--primary-foreground); }

  .card-link, .card-static { display:flex; flex-direction:column; background:var(--card); border:1px solid var(--border); border-radius:1rem; padding:1.25rem; box-shadow:0 1px 2px oklch(15% .02 260 / .04); transition:.18s; text-decoration:none; color:inherit; }
  .card-link:hover { transform:translateY(-4px); border-color:var(--tint-20); box-shadow:0 10px 24px -12px oklch(15% .02 260 / .15); }
  .card-link:hover .card-title { color:var(--primary); }

  .search-bar { display:flex; align-items:center; gap:.75rem; border-radius:999px; border:1px solid var(--border); background:var(--card); padding:.75rem 1.1rem; box-shadow:0 1px 2px oklch(15% .02 260 / .04); }
  .search-bar input { flex:1; background:transparent; border:none; outline:none; font-size:.875rem; color:var(--foreground); font-family:inherit; }
  .search-bar input::placeholder { color:var(--muted-foreground); }

  .badge { display:inline-flex; align-items:center; padding:.28rem .7rem; border-radius:999px; font-size:.72rem; font-weight:500; white-space:nowrap; background:var(--secondary); color:var(--secondary-foreground); }

  .icon-tile { display:flex; align-items:center; justify-content:center; border-radius:.75rem; background:var(--tint-10); color:var(--primary); flex-shrink:0; }

  .field-label { font-size:.875rem; font-weight:500; color:var(--foreground); display:flex; align-items:center; gap:.5rem; margin-bottom:.4rem; }
  .field-label svg { color:var(--primary); }
  .field-input, .field-textarea, .field-select { width:100%; border:1px solid var(--border); border-radius:.75rem; padding:.75rem 1rem; font-size:.875rem; background:var(--background); color:var(--foreground); font-family:inherit; }
  .field-input:focus, .field-textarea:focus, .field-select:focus { outline:2px solid var(--ring); outline-offset:1px; }
  .field-textarea { resize:vertical; min-height:7rem; }

  .chat-bubble-them { background:var(--secondary); color:var(--secondary-foreground); }
  .chat-bubble-me { background:var(--primary); color:var(--primary-foreground); }

  .stat-tile { border-radius:.75rem; padding:1rem; background:var(--secondary); }
  .muted { color:var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

/* ---------------- Icons (Lucide, ISC licensed) ---------------- */

const iconBase = { xmlns: "http://www.w3.org/2000/svg", width: 24, height: 24, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": "true" };

function ArrowLeftIcon({ className }) { return <svg {...iconBase} className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>; }
function SearchIcon({ className }) { return <svg {...iconBase} className={className}><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>; }
function StarIcon({ className }) { return <svg {...iconBase} fill="var(--star)" stroke="var(--star)" className={className}><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>; }
function PlusIcon({ className }) { return <svg {...iconBase} className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>; }
function HandHelpingIcon({ className }) { return <svg {...iconBase} className={className}><path d="M11 12h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 14"/><path d="m7 18 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 13 6 6"/></svg>; }
function HelpCircleIcon({ className }) { return <svg {...iconBase} className={className}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>; }
function MessageSquareIcon({ className }) { return <svg {...iconBase} className={className}><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></svg>; }
function ListIcon({ className }) { return <svg {...iconBase} className={className}><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></svg>; }
function FileTextIcon({ className }) { return <svg {...iconBase} className={className}><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>; }
function WalletIcon({ className }) { return <svg {...iconBase} className={className}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>; }
function CalendarIcon({ className }) { return <svg {...iconBase} className={className}><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>; }
function SendIcon({ className }) { return <svg {...iconBase} className={className}><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>; }
function UserIcon({ className }) { return <svg {...iconBase} className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>; }
function CheckIcon({ className }) { return <svg {...iconBase} className={className}><path d="M20 6 9 17l-5-5"/></svg>; }

/* ---------------- Data ---------------- */

const CATEGORIES = ["Programming & Tech", "Design", "Tutoring", "Language & Writing", "Event & Creative"];

const SERVICES = [
  { slug: "python-debugging", name: "Alex T.", initials: "AT", category: "Programming & Tech", title: "Python Debugging", description: "Stuck on a bug or failing test? I can help you debug Python code, explain errors, and get your assignment running smoothly.", price: "฿150–250", rating: 4.9, reviews: 24 },
  { slug: "figma-ui-design", name: "Mina K.", initials: "MK", category: "Design", title: "Figma UI Design", description: "Need a clean UI for your project or prototype? I design screens, components, and user flows in Figma for web and mobile apps.", price: "฿200–500", rating: 4.8, reviews: 31 },
  { slug: "english-proofreading", name: "Ploy S.", initials: "PS", category: "Language & Writing", title: "English Proofreading", description: "Polish your reports, essays, and presentations. I fix grammar, clarity, and tone while keeping your voice intact.", price: "฿100–200", rating: 5.0, reviews: 17 },
  { slug: "event-photography", name: "Mark C.", initials: "MC", category: "Event & Creative", title: "Event Photography", description: "Capture your club event, graduation shoot, or project showcase. I bring a camera, edit the best shots, and deliver them fast.", price: "฿500+", rating: 4.9, reviews: 12 },
  { slug: "excel-help", name: "Beam P.", initials: "BP", category: "Programming & Tech", title: "Excel Help", description: "From formulas and pivot tables to charts and dashboards, I can make your spreadsheet do the work for you.", price: "฿100–300", rating: 4.8, reviews: 19 },
  { slug: "calculus-tutoring", name: "Nicha R.", initials: "NR", category: "Tutoring", title: "Calculus Tutoring", description: "One-on-one sessions to help you prepare for midterms, solve problem sets, and actually understand the concepts.", price: "฿250–350", rating: 4.9, reviews: 28 },
];

const REQUESTS = [
  { slug: "python-tonight", name: "Nut A.", initials: "NA", category: "Programming & Tech", title: "Need help debugging Python tonight", description: "My data structures assignment throws an index error I can't trace. Looking for someone to hop on a call for ~1 hour tonight and walk through it with me.", budget: "฿200", deadline: "Tonight, 9 PM" },
  { slug: "poster-design", name: "Praew J.", initials: "PJ", category: "Design", title: "Looking for someone to design a poster", description: "Our club is running an open house next week and we need one A3 poster plus an Instagram version. Simple, clean, with our logo and event details.", budget: "฿350", deadline: "Fri, this week" },
  { slug: "presentation-proofread", name: "Boss S.", initials: "BS", category: "Language & Writing", title: "Need an English presentation proofread", description: "12 slides for a business communication class. I need grammar fixes and help making the wording sound natural before I rehearse.", budget: "฿150", deadline: "Thu, 6 PM" },
  { slug: "event-photographer", name: "Fern K.", initials: "FK", category: "Event & Creative", title: "Looking for an event photographer", description: "Engineering night this Saturday, roughly 3 hours of coverage. Need edited photos delivered within a few days for our social pages.", budget: "฿600", deadline: "Sat, this week" },
  { slug: "excel-dashboard", name: "Ton P.", initials: "TP", category: "Programming & Tech", title: "Need an Excel dashboard for my project data", description: "I have survey results in a messy sheet. I want pivot tables and a couple of charts I can drop into my report.", budget: "฿250", deadline: "Next Mon" },
  { slug: "calculus-cram", name: "Mild R.", initials: "MR", category: "Tutoring", title: "Looking for a calculus tutor before midterm", description: "Two sessions on integration techniques and series. I learn best by working through past exam problems together.", budget: "฿300/hr", deadline: "Sun, this week" },
];

/* ---------------- Router ---------------- */

function useRouter() {
  const [path, setPath] = useState(window.location.pathname || "/");
  useEffect(() => {
    const onPop = () => setPath(window.location.pathname || "/");
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  const nav = (to) => {
    if (to !== window.location.pathname) {
      window.history.pushState({}, "", to);
      setPath(to);
    }
    window.scrollTo({ top: 0, behavior: "instant" });
  };
  return [path, nav];
}

function Link({ to, nav, className, children }) {
  return (
    <a href={to} className={className} onClick={(e) => { e.preventDefault(); nav(to); }}>
      {children}
    </a>
  );
}

/* ---------------- Small UI atoms ---------------- */

function Avatar({ initials, size, radius = "full", tone = "tint" }) {
  const radiusMap = { full: "9999px", xl: ".75rem", "2xl": "1rem" };
  const toneMap = {
    tint: { background: "var(--tint-10)", color: "var(--primary)" },
    solid: { background: "var(--primary)", color: "var(--primary-foreground)" },
    muted: { background: "var(--muted)", color: "var(--muted-foreground)" },
  };
  return (
    <div className="flex items-center justify-center font-bold shrink-0" style={{ width: size, height: size, borderRadius: radiusMap[radius], fontSize: size * 0.32, ...toneMap[tone] }}>
      {initials}
    </div>
  );
}

function CategoryPills({ active, onChange }) {
  return (
    <React.Fragment>
      <button className={`pill ${active === "All" ? "active" : ""}`} onClick={() => onChange("All")}>All</button>
      {CATEGORIES.map(c => (
        <button key={c} className={`pill ${active === c ? "active" : ""}`} onClick={() => onChange(c)}>{c}</button>
      ))}
    </React.Fragment>
  );
}

function SearchBar({ value, onChange, placeholder }) {
  return (
    <div className="search-bar">
      <SearchIcon className="h-5 w-5 muted" />
      <input value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} />
    </div>
  );
}

function EmptyState({ text }) {
  return (
    <div className="flex flex-col items-center gap-3 py-20 text-center muted">
      <SearchIcon className="h-8 w-8" />
      <p>{text}</p>
    </div>
  );
}

function Field({ label, icon, children }) {
  return (
    <div>
      <span className="field-label">{icon}{label}</span>
      {children}
    </div>
  );
}

function ChatCard({ item, opener, onMatch, matched, matchLabel }) {
  const [messages, setMessages] = useState([{ from: "them", text: opener }]);
  const [draft, setDraft] = useState("");
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  const send = () => {
    if (!draft.trim()) return;
    setMessages(m => [...m, { from: "me", text: draft.trim() }]);
    setDraft("");
    setTimeout(() => {
      setMessages(m => [...m, { from: "them", text: "Sounds good — let's sort out the details." }]);
    }, 700);
  };

  return (
    <div className="mt-8">
      <h2 className="mb-3 text-lg font-semibold">Chat with {item.name}</h2>
      <div className="rounded-2xl border shadow-sm" style={{ borderColor: "var(--border)", background: "var(--card)" }}>
        <div className="flex items-center gap-3 border-b px-5 py-4" style={{ borderColor: "var(--border)" }}>
          <Avatar initials={item.initials} size={36} radius="full" tone="tint" />
          <div>
            <div className="text-sm font-semibold">{item.name}</div>
            <div className="text-xs muted">Usually replies within an hour</div>
          </div>
        </div>
        <div ref={scrollRef} className="flex flex-col gap-3 overflow-y-auto px-5 py-4" style={{ maxHeight: "20rem" }}>
          {messages.map((m, i) => (
            <div key={i} className={`max-w-[80%] rounded-2xl px-4 py-2.5 text-sm ${m.from === "me" ? "chat-bubble-me self-end" : "chat-bubble-them self-start"}`}>{m.text}</div>
          ))}
        </div>
        <form onSubmit={e => { e.preventDefault(); send(); }} className="flex items-center gap-2 border-t px-4 py-3" style={{ borderColor: "var(--border)" }}>
          <input value={draft} onChange={e => setDraft(e.target.value)} placeholder="Discuss the task..." className="field-input" style={{ flex: 1 }} />
          <button type="submit" disabled={!draft.trim()} className="btn btn-primary btn-icon" aria-label="Send message">
            <SendIcon className="h-4 w-4" />
          </button>
        </form>
        <div className="border-t px-5 py-4" style={{ borderColor: "var(--border)" }}>
          {matched ? (
            <div className="btn btn-primary btn-block" style={{ opacity: .65, cursor: "default" }}>
              <CheckIcon className="h-4 w-4" /> Matched
            </div>
          ) : (
            <button onClick={onMatch} className="btn btn-primary btn-block">{matchLabel}</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Cards ---------------- */

function ServiceCard({ item, nav }) {
  return (
    <Link to={`/service/${item.slug}`} nav={nav} className="card-link fade-in">
      <div className="mb-4 flex items-start justify-between gap-3">
        <Avatar initials={item.initials} size={48} radius="xl" tone="tint" />
        <span className="badge">{item.category}</span>
      </div>
      <h3 className="card-title text-lg font-semibold transition">{item.title}</h3>
      <p className="mt-1 text-sm line-clamp-2 muted">{item.description}</p>
      <div className="mt-auto flex items-center justify-between pt-4">
        <span className="text-sm font-semibold">{item.price}</span>
        <span className="flex items-center gap-1 text-sm muted">
          <StarIcon className="h-4 w-4" />
          <span className="font-medium" style={{ color: "var(--foreground)" }}>{item.rating.toFixed(1)}</span>
          <span className="text-xs">({item.reviews})</span>
        </span>
      </div>
      <div className="mt-3 flex items-center gap-2 border-t pt-3" style={{ borderColor: "var(--border)" }}>
        <Avatar initials={item.initials[0]} size={24} radius="full" tone="muted" />
        <span className="text-sm font-medium">{item.name}</span>
      </div>
    </Link>
  );
}

function RequestCard({ item, nav }) {
  return (
    <Link to={`/requests/${item.slug}`} nav={nav} className="card-link fade-in">
      <div className="mb-4 flex items-start justify-between gap-3">
        <div className="flex items-center gap-2.5">
          <Avatar initials={item.initials} size={40} radius="full" tone="tint" />
          <span className="text-sm font-medium">{item.name}</span>
        </div>
        <span className="badge">{item.category}</span>
      </div>
      <h3 className="card-title text-lg font-semibold transition">{item.title}</h3>
      <p className="mt-1 text-sm line-clamp-2 muted">{item.description}</p>
      <div className="mt-auto flex items-center justify-between gap-3 border-t pt-4" style={{ borderColor: "var(--border)" }}>
        <span className="flex items-center gap-1.5 text-sm font-semibold">
          <WalletIcon className="h-4 w-4 muted" /> {item.budget}
        </span>
        <span className="flex items-center gap-1.5 text-sm muted">
          <CalendarIcon className="h-4 w-4" /> {item.deadline}
        </span>
      </div>
    </Link>
  );
}

/* ---------------- Pages ---------------- */

function ServicesPage({ nav }) {
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("All");
  const filtered = useMemo(() => SERVICES.filter(s =>
    (category === "All" || s.category === category) &&
    (s.title.toLowerCase().includes(query.toLowerCase()) || s.name.toLowerCase().includes(query.toLowerCase()) || s.description.toLowerCase().includes(query.toLowerCase()))
  ), [query, category]);

  return (
    <div className="fade-in mx-auto max-w-7xl px-4 pt-12 sm:px-6 lg:px-8">
      <div className="flex flex-col items-center text-center">
        <h1 className="text-4xl font-extrabold tracking-tight sm:text-5xl">Services</h1>
        <p className="mt-3 text-lg muted">See what SIIT students can help you with.</p>
        <div className="mt-8 w-full max-w-xl">
          <SearchBar value={query} onChange={setQuery} placeholder="Search services, skills, or students..." />
        </div>
        <div className="mt-6 flex flex-wrap items-center justify-center gap-2">
          <CategoryPills active={category} onChange={setCategory} />
        </div>
      </div>

      <div className="py-12">
        <div className="flex items-center justify-between">
          <h2 className="text-xl font-semibold">{category === "All" ? "All services" : category}</h2>
          <span className="text-sm muted">{filtered.length} available</span>
        </div>
        {filtered.length === 0 ? (
          <EmptyState text="No services match your search." />
        ) : (
          <div className="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            {filtered.map(s => <ServiceCard key={s.slug} item={s} nav={nav} />)}
          </div>
        )}

        <div className="mt-14 rounded-2xl px-6 py-10 text-center sm:px-12 sm:py-14" style={{ background: "var(--primary)", color: "var(--primary-foreground)" }}>
          <h2 className="text-2xl font-bold sm:text-3xl">Need something done instead?</h2>
          <p className="mx-auto mt-2 max-w-lg" style={{ color: "var(--primary-fg-80)" }}>Browse what other students need help with, or post your own request.</p>
          <div className="mt-6 flex flex-wrap justify-center gap-3">
            <Link to="/requests" nav={nav} className="btn btn-white">Browse Help Requests</Link>
            <Link to="/post" nav={nav} className="btn btn-outline-light">Post something</Link>
          </div>
        </div>
      </div>
    </div>
  );
}

function RequestsPage({ nav }) {
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("All");
  const filtered = useMemo(() => REQUESTS.filter(r =>
    (category === "All" || r.category === category) &&
    (r.title.toLowerCase().includes(query.toLowerCase()) || r.name.toLowerCase().includes(query.toLowerCase()) || r.description.toLowerCase().includes(query.toLowerCase()))
  ), [query, category]);

  return (
    <div className="fade-in mx-auto max-w-7xl px-4 pt-12 sm:px-6 lg:px-8">
      <div className="flex flex-col items-center text-center">
        <h1 className="text-4xl font-extrabold tracking-tight sm:text-5xl">Help Requests</h1>
        <p className="mt-3 text-lg muted">See what SIIT students need help with.</p>
        <div className="mt-8 w-full max-w-xl">
          <SearchBar value={query} onChange={setQuery} placeholder="Search requests, tasks, or students..." />
        </div>
        <div className="mt-6 flex flex-wrap items-center justify-center gap-2">
          <CategoryPills active={category} onChange={setCategory} />
        </div>
      </div>

      <div className="py-12">
        <div className="flex items-center justify-between">
          <h2 className="text-xl font-semibold">Open requests</h2>
          <span className="text-sm muted">{filtered.length} open</span>
        </div>
        {filtered.length === 0 ? (
          <EmptyState text="No help requests match your search." />
        ) : (
          <div className="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            {filtered.map(r => <RequestCard key={r.slug} item={r} nav={nav} />)}
          </div>
        )}

        <div className="mt-14 rounded-2xl border p-10 text-center sm:px-12" style={{ borderColor: "var(--border)", background: "var(--card)" }}>
          <h2 className="text-2xl font-bold">Need help yourself?</h2>
          <p className="mx-auto mt-2 max-w-lg text-sm muted">Post a request and let the right student find you.</p>
          <Link to="/post/request" nav={nav} className="btn btn-primary mt-6 inline-flex">Post a Help Request</Link>
        </div>
      </div>
    </div>
  );
}

function PostPage({ nav }) {
  return (
    <div className="fade-in mx-auto max-w-3xl px-4 py-16 sm:px-6 lg:px-8">
      <div className="text-center">
        <h1 className="text-3xl font-extrabold tracking-tight sm:text-4xl">What would you like to post?</h1>
        <p className="mt-3 text-sm muted">One account, two kinds of posts. Offer your skills or ask for help.</p>
      </div>
      <div className="mt-10 grid gap-5 sm:grid-cols-2">
        <Link to="/post/service" nav={nav} className="card-link">
          <div className="icon-tile" style={{ width: 48, height: 48 }}><HandHelpingIcon className="h-6 w-6" /></div>
          <h2 className="card-title mt-4 text-lg font-semibold transition">I can help with something</h2>
          <p className="mt-1 text-sm muted">Create a service post so students can find and hire you.</p>
        </Link>
        <Link to="/post/request" nav={nav} className="card-link">
          <div className="icon-tile" style={{ width: 48, height: 48 }}><HelpCircleIcon className="h-6 w-6" /></div>
          <h2 className="card-title mt-4 text-lg font-semibold transition">I need help with something</h2>
          <p className="mt-1 text-sm muted">Post a help request with your budget and deadline.</p>
        </Link>
      </div>
    </div>
  );
}

function PostServiceForm({ nav }) {
  const [form, setForm] = useState({ title: "", category: "", description: "", price: "" });
  const [submitted, setSubmitted] = useState(false);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const submit = (e) => { e.preventDefault(); setSubmitted(true); };

  if (submitted) {
    return (
      <div className="fade-in mx-auto max-w-2xl px-4 py-20 text-center sm:px-6 lg:px-8">
        <h1 className="text-2xl font-extrabold">Service posted!</h1>
        <p className="mt-2 muted">Other students can now find "{form.title}".</p>
        <Link to="/" nav={nav} className="btn btn-primary mt-6 inline-flex">Back to Services</Link>
      </div>
    );
  }

  return (
    <div className="fade-in mx-auto max-w-2xl px-4 py-10 sm:px-6 lg:px-8">
      <Link to="/post" nav={nav} className="inline-flex items-center gap-2 text-sm font-medium transition muted">
        <ArrowLeftIcon className="h-4 w-4" /> Back
      </Link>
      <div className="mt-6 rounded-2xl border p-6 shadow-sm sm:p-8" style={{ borderColor: "var(--border)", background: "var(--card)" }}>
        <h1 className="text-2xl font-bold sm:text-3xl">I can help with something</h1>
        <p className="mt-2 text-sm muted">Describe the service you offer and what you charge.</p>

        <form onSubmit={submit} className="mt-6 space-y-5">
          <Field label="Service title" icon={<MessageSquareIcon className="h-4 w-4" />}>
            <input required value={form.title} onChange={set("title")} className="field-input" placeholder="e.g., Python Debugging" />
          </Field>
          <Field label="Skills / category" icon={<ListIcon className="h-4 w-4" />}>
            <select required value={form.category} onChange={set("category")} className="field-select">
              <option value="" disabled>Select a category</option>
              {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Description" icon={<FileTextIcon className="h-4 w-4" />}>
            <textarea required value={form.description} onChange={set("description")} className="field-textarea" placeholder="What you help with, how you work, what students get..." />
          </Field>
          <Field label="Price / starting price" icon={<WalletIcon className="h-4 w-4" />}>
            <input required value={form.price} onChange={set("price")} className="field-input" placeholder="e.g., ฿150–250" />
          </Field>
          <button type="submit" className="btn btn-primary btn-block mt-2">Post Service</button>
        </form>
      </div>
    </div>
  );
}

function PostRequestForm({ nav }) {
  const [form, setForm] = useState({ title: "", category: "", description: "", budget: "", deadline: "" });
  const [submitted, setSubmitted] = useState(false);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const submit = (e) => { e.preventDefault(); setSubmitted(true); };

  if (submitted) {
    return (
      <div className="fade-in mx-auto max-w-2xl px-4 py-20 text-center sm:px-6 lg:px-8">
        <h1 className="text-2xl font-extrabold">Request posted!</h1>
        <p className="mt-2 muted">SIIT students can now see "{form.title}".</p>
        <Link to="/requests" nav={nav} className="btn btn-primary mt-6 inline-flex">Back to Help Requests</Link>
      </div>
    );
  }

  return (
    <div className="fade-in mx-auto max-w-2xl px-4 py-10 sm:px-6 lg:px-8">
      <Link to="/post" nav={nav} className="inline-flex items-center gap-2 text-sm font-medium transition muted">
        <ArrowLeftIcon className="h-4 w-4" /> Back
      </Link>
      <div className="mt-6 rounded-2xl border p-6 shadow-sm sm:p-8" style={{ borderColor: "var(--border)", background: "var(--card)" }}>
        <h1 className="text-2xl font-bold sm:text-3xl">I need help with something</h1>
        <p className="mt-2 text-sm muted">Describe the task and SIIT students will see your request.</p>

        <form onSubmit={submit} className="mt-6 space-y-5">
          <Field label="What do you need help with?" icon={<MessageSquareIcon className="h-4 w-4" />}>
            <input required value={form.title} onChange={set("title")} className="field-input" placeholder="e.g., Need help debugging Python tonight" />
          </Field>
          <Field label="Category" icon={<ListIcon className="h-4 w-4" />}>
            <select required value={form.category} onChange={set("category")} className="field-select">
              <option value="" disabled>Select a category</option>
              {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Description" icon={<FileTextIcon className="h-4 w-4" />}>
            <textarea required value={form.description} onChange={set("description")} className="field-textarea" placeholder="Explain the task and anything the helper should know..." />
          </Field>
          <Field label="Budget" icon={<WalletIcon className="h-4 w-4" />}>
            <input required value={form.budget} onChange={set("budget")} className="field-input" placeholder="e.g., ฿200" />
          </Field>
          <Field label="Deadline" icon={<CalendarIcon className="h-4 w-4" />}>
            <input required value={form.deadline} onChange={set("deadline")} className="field-input" placeholder="e.g., Tonight, 9 PM" />
          </Field>
          <button type="submit" className="btn btn-primary btn-block mt-2">Post Request</button>
        </form>
      </div>
    </div>
  );
}

function ServiceDetail({ slug, nav }) {
  const item = SERVICES.find(s => s.slug === slug);
  const [matched, setMatched] = useState(false);

  if (!item) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-20 text-center sm:px-6 lg:px-8">
        <p className="muted">Service not found.</p>
        <Link to="/" nav={nav} className="btn btn-outline mt-4 inline-flex">Back to services</Link>
      </div>
    );
  }

  return (
    <div className="fade-in mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8">
      <Link to="/" nav={nav} className="inline-flex items-center gap-2 text-sm font-medium transition muted">
        <ArrowLeftIcon className="h-4 w-4" /> Back to services
      </Link>

      <div className="mt-6 rounded-2xl border p-6 shadow-sm sm:p-8" style={{ borderColor: "var(--border)", background: "var(--card)" }}>
        <div className="flex items-start gap-4">
          <Avatar initials={item.initials} size={64} radius="2xl" tone="solid" />
          <div className="flex-1">
            <span className="badge">{item.category}</span>
            <h1 className="mt-2 text-2xl font-bold sm:text-3xl">{item.title}</h1>
            <p className="mt-1 text-sm muted">Offered by {item.name}</p>
          </div>
        </div>

        <div className="mt-6 grid gap-4 sm:grid-cols-3">
          <div className="stat-tile">
            <div className="text-xs font-medium muted">Starting price</div>
            <div className="mt-1 text-lg font-semibold">{item.price}</div>
          </div>
          <div className="stat-tile">
            <div className="text-xs font-medium muted">Rating</div>
            <div className="mt-1 flex items-center gap-1 text-lg font-semibold">
              <StarIcon className="h-5 w-5" /> {item.rating.toFixed(1)} <span className="text-xs font-normal muted">({item.reviews})</span>
            </div>
          </div>
          <div className="stat-tile">
            <div className="text-xs font-medium muted">Student</div>
            <div className="mt-1 flex items-center gap-2 text-lg font-semibold">
              <UserIcon className="h-4 w-4 muted" /> {item.name}
            </div>
          </div>
        </div>

        <div className="mt-6">
          <h2 className="text-sm font-semibold">About this service</h2>
          <p className="mt-2 text-sm leading-relaxed muted">{item.description}</p>
        </div>
      </div>

      <ChatCard
        item={item}
        opener={`Hi! I offer ${item.title}. Tell me about your task and I'll let you know how I can help.`}
        onMatch={() => setMatched(true)}
        matched={matched}
        matchLabel="Match with this student"
      />
    </div>
  );
}

function RequestDetail({ slug, nav }) {
  const item = REQUESTS.find(r => r.slug === slug);
  const [matched, setMatched] = useState(false);

  if (!item) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-20 text-center sm:px-6 lg:px-8">
        <p className="muted">Request not found.</p>
        <Link to="/requests" nav={nav} className="btn btn-outline mt-4 inline-flex">Back to help requests</Link>
      </div>
    );
  }

  return (
    <div className="fade-in mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8">
      <Link to="/requests" nav={nav} className="inline-flex items-center gap-2 text-sm font-medium transition muted">
        <ArrowLeftIcon className="h-4 w-4" /> Back to help requests
      </Link>

      <div className="mt-6 rounded-2xl border p-6 shadow-sm sm:p-8" style={{ borderColor: "var(--border)", background: "var(--card)" }}>
        <div className="flex items-start gap-4">
          <Avatar initials={item.initials} size={56} radius="full" tone="tint" />
          <div className="flex-1">
            <span className="badge">{item.category}</span>
            <h1 className="mt-2 text-2xl font-bold sm:text-3xl">{item.title}</h1>
            <p className="mt-1 text-sm muted">Posted by {item.name}</p>
          </div>
        </div>

        <div className="mt-6 grid gap-4 sm:grid-cols-2">
          <div className="stat-tile">
            <div className="flex items-center gap-2 text-xs font-medium muted"><WalletIcon className="h-4 w-4" /> Budget</div>
            <div className="mt-1 text-lg font-semibold">{item.budget}</div>
          </div>
          <div className="stat-tile">
            <div className="flex items-center gap-2 text-xs font-medium muted"><CalendarIcon className="h-4 w-4" /> Deadline</div>
            <div className="mt-1 text-lg font-semibold">{item.deadline}</div>
          </div>
        </div>

        <div className="mt-6">
          <h2 className="text-sm font-semibold">What they need</h2>
          <p className="mt-2 text-sm leading-relaxed muted">{item.description}</p>
        </div>
      </div>

      <ChatCard
        item={item}
        opener={`Hi! Thanks for checking out my request — "${item.title}". Can you help?`}
        onMatch={() => setMatched(true)}
        matched={matched}
        matchLabel="Offer to Help"
      />
    </div>
  );
}

function NotFound({ nav }) {
  return (
    <div className="mx-auto max-w-lg px-4 py-20 text-center sm:px-6 lg:px-8">
      <h1 className="text-2xl font-extrabold">Page not found</h1>
      <Link to="/" nav={nav} className="btn btn-primary mt-6 inline-flex">Back to Services</Link>
    </div>
  );
}

/* ---------------- Shell ---------------- */

function Header({ path, nav }) {
  const servicesActive = path === "/" || path.startsWith("/service/");
  const requestsActive = path === "/requests" || path.startsWith("/requests/");
  return (
    <header className="sticky top-0 z-40 w-full border-b" style={{ borderColor: "var(--border)", background: "color-mix(in oklch, var(--background) 80%, transparent)", backdropFilter: "blur(8px)" }}>
      <div className="mx-auto flex h-16 max-w-7xl items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
        <Link to="/" nav={nav} className="flex items-center gap-2.5">
          <div className="flex h-9 w-9 items-center justify-center rounded-lg" style={{ background: "var(--primary)", color: "var(--primary-foreground)" }}>
            <HandHelpingIcon className="h-5 w-5" />
          </div>
          <div className="flex flex-col">
            <span className="text-sm font-extrabold leading-none tracking-tight">WORKLINK</span>
            <span className="text-[10px] font-semibold uppercase leading-none tracking-widest" style={{ color: "var(--primary)" }}>SIIT</span>
          </div>
        </Link>
        <nav className="flex items-center gap-1">
          <Link to="/" nav={nav} className={`nav-link ${servicesActive ? "active" : ""}`}>Services</Link>
          <Link to="/requests" nav={nav} className={`nav-link ${requestsActive ? "active" : ""}`}>Help Requests</Link>
          <Link to="/post" nav={nav} className="nav-post"><PlusIcon className="h-4 w-4" /> Post</Link>
        </nav>
      </div>
    </header>
  );
}

function App() {
  const [path, nav] = useRouter();

  let page;
  if (path === "/") page = <ServicesPage nav={nav} />;
  else if (path === "/requests") page = <RequestsPage nav={nav} />;
  else if (path.startsWith("/requests/")) page = <RequestDetail slug={path.replace("/requests/", "")} nav={nav} />;
  else if (path === "/post") page = <PostPage nav={nav} />;
  else if (path === "/post/service") page = <PostServiceForm nav={nav} />;
  else if (path === "/post/request") page = <PostRequestForm nav={nav} />;
  else if (path.startsWith("/service/")) page = <ServiceDetail slug={path.replace("/service/", "")} nav={nav} />;
  else page = <NotFound nav={nav} />;

  return (
    <div className="min-h-screen" style={{ background: "var(--background)" }}>
      <Header path={path} nav={nav} />
      <main>{page}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
