<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WORKLINK SIIT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Plus Jakarta Sans', sans-serif; }
  body { background: #F7F8FB; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #E2E5EC; border-radius: 8px; }
  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
  .pop-in { animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popIn { from { opacity: 0; transform: scale(.85);} to { opacity: 1; transform: scale(1);} }
</style>
</head>
<body class="min-h-screen text-slate-900">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

/* ---------------- Mock Data ---------------- */

const CATEGORIES = ["Coding", "Design", "Writing", "Tutoring", "Photography", "Excel/Data"];

const AVATAR_COLORS = ["bg-blue-100 text-blue-700","bg-violet-100 text-violet-700","bg-emerald-100 text-emerald-700","bg-amber-100 text-amber-700","bg-rose-100 text-rose-700","bg-cyan-100 text-cyan-700"];

function initials(name) {
  return name.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
}

function Avatar({ name, size = "w-10 h-10 text-sm" }) {
  const idx = name.charCodeAt(0) % AVATAR_COLORS.length;
  return (
    <div className={`${size} ${AVATAR_COLORS[idx]} rounded-full flex items-center justify-center font-bold shrink-0`}>
      {initials(name)}
    </div>
  );
}

const INITIAL_SERVICES = [
  { id: "s1", type: "service", name: "Ploy Suwannarat", title: "Python Debugging & Homework Help", category: "Coding", description: "I can help you debug Python assignments, fix errors, and explain concepts clearly. 2nd year DSI student.", price: "150 THB/hr", rating: 4.9, reviews: 21 },
  { id: "s2", type: "service", name: "Nut Chaiyaporn", title: "Figma UI/UX Design", category: "Design", description: "Clean, modern Figma designs for posters, apps, and presentations. Fast turnaround, portfolio available.", price: "300 THB/project", rating: 5.0, reviews: 14 },
  { id: "s3", type: "service", name: "Fah Kittipong", title: "English Proofreading & Editing", category: "Writing", description: "Native-level English editing for essays, reports, and presentations. Grammar, tone, and clarity fixes.", price: "80 THB/page", rating: 4.8, reviews: 33 },
  { id: "s4", type: "service", name: "Beam Anurak", title: "Calculus & Linear Algebra Tutoring", category: "Tutoring", description: "1-on-1 tutoring sessions for ICT math courses. I explain step by step until it clicks.", price: "200 THB/hr", rating: 4.9, reviews: 18 },
  { id: "s5", type: "service", name: "Ice Napassorn", title: "Event & Portrait Photography", category: "Photography", description: "I shoot campus events, portraits, and product photos. Includes basic editing and same-week delivery.", price: "500 THB/session", rating: 5.0, reviews: 9 },
  { id: "s6", type: "service", name: "Bank Thanapat", title: "Excel & Data Analysis Help", category: "Excel/Data", description: "Formulas, pivot tables, dashboards, and cleaning messy datasets for your reports and thesis work.", price: "120 THB/hr", rating: 4.7, reviews: 12 },
];

const INITIAL_REQUESTS = [
  { id: "r1", type: "request", name: "Gap Sirinya", title: "Need help debugging a Python script", category: "Coding", description: "My sorting algorithm assignment keeps throwing an IndexError and I can't figure out why. Need it fixed before Friday.", budget: "100 THB", deadline: "Aug 21, 2026" },
  { id: "r2", type: "request", name: "Two Ratchanon", title: "Looking for someone to design a poster", category: "Design", description: "Need an A2 poster for our club's open house event. Have the content ready, just need it designed nicely.", budget: "250 THB", deadline: "Aug 25, 2026" },
  { id: "r3", type: "request", name: "Mind Pattarapon", title: "Need an English presentation proofread", category: "Writing", description: "10-slide presentation for my capstone review. Just need grammar and phrasing checked before Monday.", budget: "150 THB", deadline: "Aug 24, 2026" },
  { id: "r4", type: "request", name: "Aim Warisara", title: "Need a tutor for Statistics midterm", category: "Tutoring", description: "Struggling with hypothesis testing and regression. Looking for 2 sessions before the exam.", budget: "350 THB", deadline: "Aug 28, 2026" },
  { id: "r5", type: "request", name: "Job Kittisak", title: "Need product photos for a small shop", category: "Photography", description: "About 15 products to shoot with a plain background, need them by next week.", budget: "400 THB", deadline: "Aug 27, 2026" },
  { id: "r6", type: "request", name: "Fern Chayapa", title: "Need help building an Excel dashboard", category: "Excel/Data", description: "Have raw survey data and need it turned into charts and a summary dashboard for a group project.", budget: "200 THB", deadline: "Aug 23, 2026" },
];

/* ---------------- Small UI atoms ---------------- */

function Badge({ children, className = "" }) {
  return <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${className}`}>{children}</span>;
}

function CategoryBadge({ category }) {
  return <Badge className="bg-slate-100 text-slate-600">{category}</Badge>;
}

function StarRating({ rating, reviews }) {
  return (
    <div className="flex items-center gap-1 text-sm text-slate-500">
      <span className="text-amber-500">★</span>
      <span className="font-semibold text-slate-700">{rating}</span>
      <span>({reviews})</span>
    </div>
  );
}

function PrimaryButton({ children, onClick, className = "", type = "button" }) {
  return (
    <button type={type} onClick={onClick}
      className={`bg-blue-600 hover:bg-blue-700 active:scale-[.98] transition text-white font-semibold rounded-xl px-5 py-2.5 shadow-sm shadow-blue-600/20 ${className}`}>
      {children}
    </button>
  );
}

function GhostButton({ children, onClick, className = "" }) {
  return (
    <button onClick={onClick}
      className={`bg-white hover:bg-slate-50 active:scale-[.98] transition text-slate-700 font-semibold rounded-xl px-5 py-2.5 border border-slate-200 ${className}`}>
      {children}
    </button>
  );
}

/* ---------------- Navbar ---------------- */

function Navbar({ page, setPage, onPost }) {
  const links = [
    { key: "home", label: "Home" },
    { key: "services", label: "Services" },
    { key: "requests", label: "Help Requests" },
  ];
  return (
    <div className="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-slate-100">
      <div className="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
        <button onClick={() => setPage("home")} className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-extrabold text-sm">W</div>
          <span className="font-extrabold text-lg tracking-tight">WORKLINK <span className="text-blue-600">SIIT</span></span>
        </button>
        <div className="hidden md:flex items-center gap-1">
          {links.map(l => (
            <button key={l.key} onClick={() => setPage(l.key)}
              className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${page === l.key ? "bg-blue-50 text-blue-700" : "text-slate-500 hover:text-slate-800 hover:bg-slate-50"}`}>
              {l.label}
            </button>
          ))}
        </div>
        <PrimaryButton onClick={onPost} className="!px-4 !py-2 text-sm">+ Post</PrimaryButton>
      </div>
    </div>
  );
}

/* ---------------- Cards ---------------- */

function ServiceCard({ item, onView }) {
  return (
    <div className="fade-in bg-white rounded-2xl border border-slate-100 p-5 flex flex-col gap-3 hover:shadow-lg hover:shadow-slate-200/60 hover:-translate-y-0.5 transition">
      <div className="flex items-center gap-3">
        <Avatar name={item.name} />
        <div className="min-w-0">
          <p className="font-semibold text-sm truncate">{item.name}</p>
          <StarRating rating={item.rating} reviews={item.reviews} />
        </div>
      </div>
      <div>
        <h3 className="font-bold text-slate-900 leading-snug">{item.title}</h3>
        <p className="text-sm text-slate-500 mt-1 line-clamp-2">{item.description}</p>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <CategoryBadge category={item.category} />
        <Badge className="bg-blue-50 text-blue-700">{item.price}</Badge>
      </div>
      <PrimaryButton onClick={() => onView(item)} className="w-full mt-1 text-sm">View</PrimaryButton>
    </div>
  );
}

function RequestCard({ item, onView }) {
  return (
    <div className="fade-in bg-white rounded-2xl border border-slate-100 p-5 flex flex-col gap-3 hover:shadow-lg hover:shadow-slate-200/60 hover:-translate-y-0.5 transition">
      <div className="flex items-center gap-3">
        <Avatar name={item.name} />
        <div className="min-w-0">
          <p className="font-semibold text-sm truncate">{item.name}</p>
          <p className="text-xs text-slate-400">Deadline: {item.deadline}</p>
        </div>
      </div>
      <div>
        <h3 className="font-bold text-slate-900 leading-snug">{item.title}</h3>
        <p className="text-sm text-slate-500 mt-1 line-clamp-2">{item.description}</p>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <CategoryBadge category={item.category} />
        <Badge className="bg-emerald-50 text-emerald-700">Budget: {item.budget}</Badge>
      </div>
      <GhostButton onClick={() => onView(item)} className="w-full mt-1 text-sm !border-blue-200 !text-blue-700">View</GhostButton>
    </div>
  );
}

/* ---------------- Search + Filter bar ---------------- */

function FilterBar({ query, setQuery, category, setCategory, placeholder }) {
  return (
    <div className="flex flex-col sm:flex-row gap-3 mb-6">
      <div className="relative flex-1">
        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">⌕</span>
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder={placeholder}
          className="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400" />
      </div>
      <select value={category} onChange={e => setCategory(e.target.value)}
        className="bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400">
        <option value="All">All categories</option>
        {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
      </select>
    </div>
  );
}

/* ---------------- Home Page ---------------- */

function Home({ setPage, services, requests, openDetail }) {
  return (
    <div className="fade-in">
      <div className="max-w-6xl mx-auto px-5 pt-16 pb-12 text-center">
        <div className="inline-block mb-4 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-bold tracking-wide">
          FOR SIIT STUDENTS, BY SIIT STUDENTS
        </div>
        <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900">
          WORKLINK <span className="text-blue-600">SIIT</span>
        </h1>
        <p className="mt-4 text-lg md:text-xl font-semibold text-slate-700">
          Help, from someone who gets it.
        </p>
        <p className="mt-3 max-w-xl mx-auto text-slate-500">
          Tired of help requests getting buried in LINE groups? WORKLINK gives SIIT students one
          dedicated place to connect students who need help with students who can help — coding,
          design, tutoring, proofreading, photography, Excel, and more.
        </p>
        <div className="mt-8 flex items-center justify-center gap-3 flex-wrap">
          <PrimaryButton onClick={() => setPage("services")} className="text-base">Browse Services</PrimaryButton>
          <GhostButton onClick={() => setPage("requests")} className="text-base">Find Help</GhostButton>
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-5 pb-10">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-bold text-lg">Popular services</h2>
          <button onClick={() => setPage("services")} className="text-sm font-semibold text-blue-600 hover:underline">See all →</button>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {services.slice(0, 3).map(s => <ServiceCard key={s.id} item={s} onView={openDetail} />)}
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-5 pb-20">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-bold text-lg">Recent help requests</h2>
          <button onClick={() => setPage("requests")} className="text-sm font-semibold text-blue-600 hover:underline">See all →</button>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {requests.slice(0, 3).map(r => <RequestCard key={r.id} item={r} onView={openDetail} />)}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Services / Requests list pages ---------------- */

function ServicesPage({ services, openDetail }) {
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("All");
  const filtered = useMemo(() => services.filter(s =>
    (category === "All" || s.category === category) &&
    (s.title.toLowerCase().includes(query.toLowerCase()) || s.name.toLowerCase().includes(query.toLowerCase()) || s.description.toLowerCase().includes(query.toLowerCase()))
  ), [services, query, category]);

  return (
    <div className="fade-in max-w-6xl mx-auto px-5 py-10">
      <h1 className="text-2xl font-extrabold mb-1">Services</h1>
      <p className="text-slate-500 mb-6">Students offering their skills — "I can help".</p>
      <FilterBar query={query} setQuery={setQuery} category={category} setCategory={setCategory} placeholder="Search services, e.g. Python, Figma..." />
      {filtered.length === 0 ? (
        <EmptyState text="No services match your search." />
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map(s => <ServiceCard key={s.id} item={s} onView={openDetail} />)}
        </div>
      )}
    </div>
  );
}

function RequestsPage({ requests, openDetail }) {
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("All");
  const filtered = useMemo(() => requests.filter(r =>
    (category === "All" || r.category === category) &&
    (r.title.toLowerCase().includes(query.toLowerCase()) || r.name.toLowerCase().includes(query.toLowerCase()) || r.description.toLowerCase().includes(query.toLowerCase()))
  ), [requests, query, category]);

  return (
    <div className="fade-in max-w-6xl mx-auto px-5 py-10">
      <h1 className="text-2xl font-extrabold mb-1">Help Requests</h1>
      <p className="text-slate-500 mb-6">Students who need a hand — "I need help".</p>
      <FilterBar query={query} setQuery={setQuery} category={category} setCategory={setCategory} placeholder="Search requests, e.g. proofreading, poster..." />
      {filtered.length === 0 ? (
        <EmptyState text="No help requests match your search." />
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map(r => <RequestCard key={r.id} item={r} onView={openDetail} />)}
        </div>
      )}
    </div>
  );
}

function EmptyState({ text }) {
  return (
    <div className="text-center py-20 text-slate-400">
      <div className="text-3xl mb-2">🔍</div>
      <p>{text}</p>
    </div>
  );
}

/* ---------------- Post flow ---------------- */

function PostChooser({ onClose, onChoose }) {
  return (
    <Modal onClose={onClose} title="What do you want to post?">
      <div className="grid sm:grid-cols-2 gap-4">
        <button onClick={() => onChoose("service")}
          className="text-left p-5 rounded-2xl border-2 border-slate-100 hover:border-blue-400 hover:bg-blue-50/40 transition group">
          <div className="text-3xl mb-2">🙋</div>
          <p className="font-bold">I can help with something</p>
          <p className="text-sm text-slate-500 mt-1">Post a service you can offer to other students.</p>
        </button>
        <button onClick={() => onChoose("request")}
          className="text-left p-5 rounded-2xl border-2 border-slate-100 hover:border-blue-400 hover:bg-blue-50/40 transition group">
          <div className="text-3xl mb-2">🙏</div>
          <p className="font-bold">I need help with something</p>
          <p className="text-sm text-slate-500 mt-1">Post a task you'd like another student to help with.</p>
        </button>
      </div>
    </Modal>
  );
}

function Field({ label, children }) {
  return (
    <label className="block">
      <span className="text-sm font-semibold text-slate-700">{label}</span>
      <div className="mt-1.5">{children}</div>
    </label>
  );
}

const inputCls = "w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400";

function ServiceForm({ onClose, onSubmit }) {
  const [form, setForm] = useState({ title: "", category: CATEGORIES[0], description: "", price: "" });
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const valid = form.title && form.description && form.price;
  return (
    <Modal onClose={onClose} title="Post a Service" subtitle="I can help with something">
      <form onSubmit={e => { e.preventDefault(); if (valid) onSubmit(form); }} className="space-y-4">
        <Field label="Title"><input required value={form.title} onChange={set("title")} className={inputCls} placeholder="e.g. Python Debugging & Homework Help" /></Field>
        <Field label="Category">
          <select value={form.category} onChange={set("category")} className={inputCls}>
            {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="Description"><textarea required value={form.description} onChange={set("description")} rows="3" className={inputCls} placeholder="What can you help with? What's your experience?" /></Field>
        <Field label="Price"><input required value={form.price} onChange={set("price")} className={inputCls} placeholder="e.g. 150 THB/hr" /></Field>
        <div className="flex gap-3 pt-2">
          <GhostButton onClick={onClose} className="flex-1">Cancel</GhostButton>
          <PrimaryButton type="submit" className="flex-1">Post Service</PrimaryButton>
        </div>
      </form>
    </Modal>
  );
}

function RequestForm({ onClose, onSubmit }) {
  const [form, setForm] = useState({ title: "", category: CATEGORIES[0], description: "", budget: "", deadline: "" });
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const valid = form.title && form.description && form.budget && form.deadline;
  return (
    <Modal onClose={onClose} title="Post a Help Request" subtitle="I need help with something">
      <form onSubmit={e => { e.preventDefault(); if (valid) onSubmit(form); }} className="space-y-4">
        <Field label="Title"><input required value={form.title} onChange={set("title")} className={inputCls} placeholder="e.g. Need help debugging Python" /></Field>
        <Field label="Category">
          <select value={form.category} onChange={set("category")} className={inputCls}>
            {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="Description"><textarea required value={form.description} onChange={set("description")} rows="3" className={inputCls} placeholder="Describe what you need help with" /></Field>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Budget"><input required value={form.budget} onChange={set("budget")} className={inputCls} placeholder="e.g. 150 THB" /></Field>
          <Field label="Deadline"><input required value={form.deadline} onChange={set("deadline")} className={inputCls} placeholder="e.g. Aug 25, 2026" /></Field>
        </div>
        <div className="flex gap-3 pt-2">
          <GhostButton onClick={onClose} className="flex-1">Cancel</GhostButton>
          <PrimaryButton type="submit" className="flex-1">Post Request</PrimaryButton>
        </div>
      </form>
    </Modal>
  );
}

function Modal({ children, onClose, title, subtitle }) {
  return (
    <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className="pop-in bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6">
        <div className="flex items-start justify-between mb-4">
          <div>
            <h2 className="text-xl font-extrabold">{title}</h2>
            {subtitle && <p className="text-sm text-blue-600 font-semibold">{subtitle}</p>}
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ---------------- Detail + Chat ---------------- */

function DetailView({ item, onClose, onMatched }) {
  const isService = item.type === "service";
  const [messages, setMessages] = useState([
    { from: "them", text: isService
        ? `Hi! Thanks for checking out my post. Feel free to ask me anything about "${item.title}".`
        : `Hi! This is about "${item.title}". Let me know if you have questions before we get started.` },
  ]);
  const [draft, setDraft] = useState("");
  const [matched, setMatched] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  const send = () => {
    if (!draft.trim()) return;
    setMessages(m => [...m, { from: "me", text: draft.trim() }]);
    setDraft("");
    setTimeout(() => {
      setMessages(m => [...m, { from: "them", text: "Sounds good, let's figure out the details 🙂" }]);
    }, 700);
  };

  const handleMatch = () => {
    setMatched(true);
    onMatched && onMatched();
  };

  return (
    <Modal onClose={onClose} title={item.title} subtitle={item.name}>
      {matched ? (
        <div className="pop-in text-center py-10">
          <div className="text-5xl mb-4">🎉</div>
          <h3 className="text-2xl font-extrabold mb-1">It's a match!</h3>
          <p className="text-slate-500 mb-6">You can now work together.</p>
          <PrimaryButton onClick={onClose}>Done</PrimaryButton>
        </div>
      ) : (
        <div>
          <div className="flex items-center gap-3 mb-3">
            <Avatar name={item.name} />
            <div>
              <p className="font-semibold text-sm">{item.name}</p>
              <div className="flex gap-2">
                <CategoryBadge category={item.category} />
                {isService
                  ? <Badge className="bg-blue-50 text-blue-700">{item.price}</Badge>
                  : <Badge className="bg-emerald-50 text-emerald-700">Budget: {item.budget}</Badge>}
              </div>
            </div>
          </div>
          <p className="text-sm text-slate-600 mb-2">{item.description}</p>
          {!isService && <p className="text-xs text-slate-400 mb-4">Deadline: {item.deadline}</p>}

          <div className="mt-4 border border-slate-200 rounded-2xl overflow-hidden">
            <div className="bg-slate-50 px-4 py-2 text-xs font-bold text-slate-500 uppercase tracking-wide">Chat</div>
            <div ref={scrollRef} className="h-56 overflow-y-auto px-4 py-3 space-y-2 bg-white">
              {messages.map((m, i) => (
                <div key={i} className={`flex ${m.from === "me" ? "justify-end" : "justify-start"}`}>
                  <div className={`max-w-[75%] rounded-2xl px-3.5 py-2 text-sm ${m.from === "me" ? "bg-blue-600 text-white rounded-br-sm" : "bg-slate-100 text-slate-700 rounded-bl-sm"}`}>
                    {m.text}
                  </div>
                </div>
              ))}
            </div>
            <div className="flex items-center gap-2 border-t border-slate-100 p-2">
              <input
                value={draft}
                onChange={e => setDraft(e.target.value)}
                onKeyDown={e => e.key === "Enter" && send()}
                placeholder="Type a message..."
                className="flex-1 text-sm px-3 py-2 rounded-lg bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500/30" />
              <button onClick={send} className="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2 text-sm font-semibold">Send</button>
            </div>
          </div>

          <PrimaryButton onClick={handleMatch} className="w-full mt-5">
            {isService ? "Request Help" : "Offer to Help"}
          </PrimaryButton>
        </div>
      )}
    </Modal>
  );
}

/* ---------------- App ---------------- */

function App() {
  const [page, setPage] = useState("home");
  const [services, setServices] = useState(INITIAL_SERVICES);
  const [requests, setRequests] = useState(INITIAL_REQUESTS);

  const [detailItem, setDetailItem] = useState(null);
  const [showChooser, setShowChooser] = useState(false);
  const [formType, setFormType] = useState(null); // 'service' | 'request'

  const openDetail = (item) => setDetailItem(item);
  const closeDetail = () => setDetailItem(null);

  const openPost = () => setShowChooser(true);
  const closePostFlow = () => { setShowChooser(false); setFormType(null); };
  const chooseType = (t) => { setShowChooser(false); setFormType(t); };

  const submitService = (form) => {
    const newItem = { id: "s" + Date.now(), type: "service", name: "You", rating: 5.0, reviews: 0, ...form };
    setServices(s => [newItem, ...s]);
    closePostFlow();
    setPage("services");
  };

  const submitRequest = (form) => {
    const newItem = { id: "r" + Date.now(), type: "request", name: "You", ...form };
    setRequests(r => [newItem, ...r]);
    closePostFlow();
    setPage("requests");
  };

  return (
    <div>
      <Navbar page={page} setPage={setPage} onPost={openPost} />

      {page === "home" && <Home setPage={setPage} services={services} requests={requests} openDetail={openDetail} />}
      {page === "services" && <ServicesPage services={services} openDetail={openDetail} />}
      {page === "requests" && <RequestsPage requests={requests} openDetail={openDetail} />}

      {detailItem && <DetailView item={detailItem} onClose={closeDetail} />}
      {showChooser && <PostChooser onClose={closePostFlow} onChoose={chooseType} />}
      {formType === "service" && <ServiceForm onClose={closePostFlow} onSubmit={submitService} />}
      {formType === "request" && <RequestForm onClose={closePostFlow} onSubmit={submitRequest} />}

      <footer className="text-center text-xs text-slate-400 py-10">
        WORKLINK SIIT · Built for SIIT students, by SIIT students.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
